s</h3>\n<table>\n<tr><th>Scope</th><th>Storage</th><th>Who sees it</th></tr>\n<tr><td>Project</td><td><code>.mcp.json</code> at repo root</td><td>The team, via version control</td></tr>\n<tr><td>Local</td><td><code>~/.claude.json</code> keyed to this project path</td><td>Only you, this project</td></tr>\n<tr><td>User</td><td><code>~/.claude.json</code> global</td><td>Only you, every project</td></tr>\n</table>\n<p>Same-name servers resolve local &gt; project &gt; user. The winning definition is used whole, not merged. Expand credentials with environment variables such as <code>${GITHUB_TOKEN}</code>; do not commit secrets.</p>\n<p>Tools from all connected servers are discovered and available together. If the agent prefers Grep over a stronger MCP tool, improve the MCP description. Prefer community servers for standard SaaS; write custom servers for team-specific workflows.</p>\n<p>Resources expose content catalogs (issue summaries, documentation trees, database schemas) so the agent does not burn exploratory tool calls. Annotations such as <code>readOnlyHint</code> are untrusted hints, not a security boundary.</p>\n"}, {"id": "2.5", "title": "Built-in tools", "html": "\n<h3>Definition</h3>\n<p>Pick the tool that matches the question. Using the wrong built-in tool is a common exam distinction.</p>\n<table>\n<tr><th>Need</th><th>Tool</th></tr>\n<tr><td>Search file contents (functions, errors, imports)</td><td>Grep</td></tr>\n<tr><td>Find files by name or path pattern</td><td>Glob</td></tr>\n<tr><td>Read a known file</td><td>Read</td></tr>\n<tr><td>Targeted unique edit</td><td>Edit / MultiEdit</td></tr>\n<tr><td>Edit cannot find unique anchor text, or full rewrite</td><td>Read then Write</td></tr>\n<tr><td>Tests and shell commands</td><td>Bash</td></tr>\n<tr><td>Broad isolated exploration</td><td>Task / Explore subagent</td></tr>\n</table>\n<h3>How to explore a codebase</h3>\n<p>Start from entry points. Grep for route names, error codes, or function identifiers. Read matching files. Follow imports. Trace one or two representative paths. Do not read hundreds of files upfront. To trace wrappers: identify exported names, then Grep each name.</p>\n<p>When asking Claude Code to follow project patterns, point at concrete files rather than \"follow our usual style.\"</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Choose Grep for content and Glob for paths.</li><li>Fall back to Read + Write when Edit is not unique.</li><li>Build understanding incrementally instead of reading the tree.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"2.5\" data-n=\"1\"><p><strong>Q1.</strong> Find every caller of refundOrder. Grep or Glob?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Grep. Glob is path/name patterns, not file contents.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"2.5\" data-n=\"2\"><p><strong>Q2.</strong> Edit fails because old_string matches twice. Next?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Widen the unique anchor; if still not unique, Read then Write.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li></ul></div>", "search": "2.5 Built-in tools \n<h3>Definition</h3>\n<p>Pick the tool that matches the question. Using the wrong built-in tool is a common exam distinction.</p>\n<table>\n<tr><th>Need</th><th>Tool</th></tr>\n<tr><td>Search file contents (functions, errors, imports)</td><td>Grep</td></tr>\n<tr><td>Find files by name or path pattern</td><td>Glob</td></tr>\n<tr><td>Read a known file</td><td>Read</td></tr>\n<tr><td>Targeted unique edit</td><td>Edit / MultiEdit</td></tr>\n<tr><td>Edit cannot find unique anchor text, or full rewrite</td><td>Read then Write</td></tr>\n<tr><td>Tests and shell commands</td><td>Bash</td></tr>\n<tr><td>Broad isolated exploration</td><td>Task / Explore subagent</td></tr>\n</table>\n<h3>How to explore a codebase</h3>\n<p>Start from entry points. Grep for route names, error codes, or function identifiers. Read matching files. Follow imports. Trace one or two representative paths. Do not read hundreds of files upfront. To trace wrappers: identify exported names, then Grep each name.</p>\n<p>When asking Claude Code to follow project patterns, point at concrete files rather than \"follow our usual style.\"</p>\n"}]}, {"id": "d3", "domain": "3", "weight": "20%", "title": "Domain 3 — Claude Code Configuration & Workflows", "kind": "domain", "tasks": [{"id": "3.1", "title": "CLAUDE.md hierarchy", "html": "\n<h3>Definition</h3>\n<p><code>CLAUDE.md</code> and rule files are persistent context, not enforced configuration. The model tries to follow them. There is no compliance guarantee. Hard rules belong in hooks or <code>permissions.deny</code>.</p>\n<h3>How loading works</h3>\n<table>\n<tr><th>Scope</th><th>Location</th><th>Shared with the team?</th></tr>\n<tr><td>Managed policy</td><td>OS-specific policy path</td><td>Organization-wide; cannot be excluded</td></tr>\n<tr><td>User</td><td><code>~/.claude/CLAUDE.md</code></td><td>No</td></tr>\n<tr><td>Project</td><td><code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code></td><td>Yes — commit it</td></tr>\n<tr><td>Local</td><td><code>CLAUDE.local.md</code></td><td>No — gitignore</td></tr>\n</table>\n<p>Broader scopes load first; more specific last. Ancestor files load fully at launch. Subdirectory files load on demand when that subtree is read. <code>@imports</code> organize content but still consume tokens at launch (up to five hops). <code>/memory</code> shows what is actually loaded — use it before rewriting instructions.</p>\n<p>If a new teammate \"does not get the rules,\" the instructions are probably in user-level memory, not project CLAUDE.md.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Diagnose hierarchy issues (user vs project).</li><li>Use @import to keep files modular.</li><li>Split large files into .claude/rules/ by topic.</li><li>Verify loaded files with /memory.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"3.1\" data-n=\"1\"><p><strong>Q1.</strong> A new hire does not see the team&#x27;s testing rules. Likely cause?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Rules live in ~/.claude/CLAUDE.md (user), not project CLAUDE.md.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"3.1\" data-n=\"2\"><p><strong>Q2.</strong> Is CLAUDE.md a guarantee the model will comply?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. It is context. Hard bans belong in hooks or permissions.deny. Use /memory to see what loaded.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li></ul></div>", "search": "3.1 CLAUDE.md hierarchy \n<h3>Definition</h3>\n<p><code>CLAUDE.md</code> and rule files are persistent context, not enforced configuration. The model tries to follow them. There is no compliance guarantee. Hard rules belong in hooks or <code>permissions.deny</code>.</p>\n<h3>How loading works</h3>\n<table>\n<tr><th>Scope</th><th>Location</th><th>Shared with the team?</th></tr>\n<tr><td>Managed policy</td><td>OS-specific policy path</td><td>Organization-wide; cannot be excluded</td></tr>\n<tr><td>User</td><td><code>~/.claude/CLAUDE.md</code></td><td>No</td></tr>\n<tr><td>Project</td><td><code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code></td><td>Yes — commit it</td></tr>\n<tr><td>Local</td><td><code>CLAUDE.local.md</code></td><td>No — gitignore</td></tr>\n</table>\n<p>Broader scopes load first; more specific last. Ancestor files load fully at launch. Subdirectory files load on demand when that subtree is read. <code>@imports</code> organize content but still consume tokens at launch (up to five hops). <code>/memory</code> shows what is actually loaded — use it before rewriting instructions.</p>\n<p>If a new teammate \"does not get the rules,\" the instructions are probably in user-level memory, not project CLAUDE.md.</p>\n"}, {"id": "3.2", "title": "Slash commands and skills", "html": "\n<h3>Definition</h3>\n<p>Slash commands are human-invoked reusable prompts. Skills are on-demand procedures Claude can also self-select from a short description. CLAUDE.md is always-on facts. Hooks are hard enforcement.</p>\n<h3>How they work</h3>\n<p>Project commands live in <code>.claude/commands/</code> and are shared. User commands live in <code>~/.claude/commands/</code>. Skills live in a folder with <code>SKILL.md</code>. The description stays in context; the body loads when the task matches. That progressive disclosure is the point of a long release checklist.</p>\n<p>Frontmatter: <code>context: fork</code> runs the skill in an isolated sub-agent so verbose analysis does not pollute the main conversation. <code>allowed-tools</code> restricts tools during the skill. <code>argument-hint</code> prompts for missing parameters. Personal variants go in <code>~/.claude/skills/</code> under a different name so teammates are unaffected.</p>\n<p>Prefer a skill when the nature of the task should trigger the procedure. Prefer a slash command when invocation must remain a deliberate human act.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Create project-scoped commands for team workflows.</li><li>Use context: fork for verbose or exploratory skills.</li><li>Restrict allowed-tools on skills that must not be destructive.</li><li>Use argument-hint when invocation needs parameters.</li><li>Choose skills vs CLAUDE.md based on always-on vs on-demand.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"3.2\" data-n=\"1\"><p><strong>Q1.</strong> A 400-line release checklist should not be in CLAUDE.md. What instead?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>A skill (or slash command if a human must invoke it). Use context: fork if output is huge.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"3.2\" data-n=\"2\"><p><strong>Q2.</strong> Skill vs slash command?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Skill: the task nature can load it. Slash command: a deliberate human button.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li></ul></div>", "search": "3.2 Slash commands and skills \n<h3>Definition</h3>\n<p>Slash commands are human-invoked reusable prompts. Skills are on-demand procedures Claude can also self-select from a short description. CLAUDE.md is always-on facts. Hooks are hard enforcement.</p>\n<h3>How they work</h3>\n<p>Project commands live in <code>.claude/commands/</code> and are shared. User commands live in <code>~/.claude/commands/</code>. Skills live in a folder with <code>SKILL.md</code>. The description stays in context; the body loads when the task matches. That progressive disclosure is the point of a long release checklist.</p>\n<p>Frontmatter: <code>context: fork</code> runs the skill in an isolated sub-agent so verbose analysis does not pollute the main conversation. <code>allowed-tools</code> restricts tools during the skill. <code>argument-hint</code> prompts for missing parameters. Personal variants go in <code>~/.claude/skills/</code> under a different name so teammates are unaffected.</p>\n<p>Prefer a skill when the nature of the task should trigger the procedure. Prefer a slash command when invocation must remain a deliberate human act.</p>\n"}, {"id": "3.3", "title": "Path-specific rules", "html": "\n<h3>Definition</h3>\n<p><code>.claude/rules/</code> files with YAML <code>paths</code> globs load only when matching files are read. That reduces irrelevant context. Globs beat subdirectory CLAUDE.md when the same convention applies across the tree (all <code>*.test.tsx</code> files).</p>\n<h3>How it works</h3>\n<p>A rule with no <code>paths</code> loads unconditionally like project CLAUDE.md. Personal rules can live in <code>~/.claude/rules/</code>. Project rules win where they overlap.</p>\n<p>Do not use path rules for task-scoped checklists such as code review. Those fire whenever matching files are touched, not only during a review. Task-scoped work belongs in a command, skill, or subagent.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Write paths globs so rules load only for matching files.</li><li>Use globs for conventions that span directories.</li><li>Choose path rules over nested CLAUDE.md when files are scattered.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"3.3\" data-n=\"1\"><p><strong>Q1.</strong> All *.test.tsx files share conventions but live in many folders. Mechanism?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>A .claude/rules file with a paths glob, not a nested CLAUDE.md in one test folder.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"3.3\" data-n=\"2\"><p><strong>Q2.</strong> Why not put a code-review checklist in path rules?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>It would fire whenever those files are read, not only during review. That is task-scoped — use a command or skill.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li></ul></div>", "search": "3.3 Path-specific rules \n<h3>Definition</h3>\n<p><code>.claude/rules/</code> files with YAML <code>paths</code> globs load only when matching files are read. That reduces irrelevant context. Globs beat subdirectory CLAUDE.md when the same convention applies across the tree (all <code>*.test.tsx</code> files).</p>\n<h3>How it works</h3>\n<p>A rule with no <code>paths</code> loads unconditionally like project CLAUDE.md. Personal rules can live in <code>~/.claude/rules/</code>. Project rules win where they overlap.</p>\n<p>Do not use path rules for task-scoped checklists such as code review. Those fire whenever matching files are touched, not only during a review. Task-scoped work belongs in a command, skill, or subagent.</p>\n"}, {"id": "3.4", "title": "Plan mode vs direct execution", "html": "\n<h3>Definition</h3>\n<p>Plan mode is workflow control: read-only exploration, a proposed plan, human approval, then edits. Direct execution is for simple, well-scoped changes. Extended thinking is a different mechanism — more internal reasoning budget, not an approval gate.</p>\n<h3>How to choose</h3>\n<p>Plan mode: large-scale changes, multiple valid approaches, architectural decisions, multi-file modifications, migrations, stakeholder approval. Direct execution: a single validation check, a one-file bug with a clear stack trace.</p>\n<p>Use the Explore subagent to isolate verbose discovery and return summaries so the main conversation is not exhausted. You can plan the migration, then execute the agreed approach.</p>\n<p>If the agent jumps to edits without surfacing trade-offs, use plan mode. If analyses are shallow on a hard problem, raise thinking effort. Both can be used together.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Select plan mode for architectural or multi-file work.</li><li>Select direct execution for narrow, obvious edits.</li><li>Use Explore to keep discovery out of the main context.</li><li>Combine plan-then-execute when investigation and implementation are different phases.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"3.4\" data-n=\"1\"><p><strong>Q1.</strong> 45-file library migration. Plan or direct?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Plan mode (then execute the agreed plan). Direct is for a narrow obvious edit.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"3.4\" data-n=\"2\"><p><strong>Q2.</strong> Plan mode vs extended thinking?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Plan mode is an approval gate. Thinking is reasoning budget. Different problems.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li><li><a href=\"#ch-13\">12. Model Selection and Inference Controls</a></li></ul></div>", "search": "3.4 Plan mode vs direct execution \n<h3>Definition</h3>\n<p>Plan mode is workflow control: read-only exploration, a proposed plan, human approval, then edits. Direct execution is for simple, well-scoped changes. Extended thinking is a different mechanism — more internal reasoning budget, not an approval gate.</p>\n<h3>How to choose</h3>\n<p>Plan mode: large-scale changes, multiple valid approaches, architectural decisions, multi-file modifications, migrations, stakeholder approval. Direct execution: a single validation check, a one-file bug with a clear stack trace.</p>\n<p>Use the Explore subagent to isolate verbose discovery and return summaries so the main conversation is not exhausted. You can plan the migration, then execute the agreed approach.</p>\n<p>If the agent jumps to edits without surfacing trade-offs, use plan mode. If analyses are shallow on a hard problem, raise thinking effort. Both can be used together.</p>\n"}, {"id": "3.5", "title": "Iterative refinement", "html": "\n<h3>Definition</h3>\n<p>Concrete input/output examples and failing tests beat prose. Claude improves fastest when feedback is executable.</p>\n<h3>How it works</h3>\n<p>Write tests or 2–3 examples first. Ask for the smallest useful implementation. Run tests. Feed exact failures (input, expected, actual, assertion). Iterate one failure class at a time unless issues interact — then send them in one detailed message because sequential fixes will fight each other.</p>\n<p>The interview pattern: have Claude ask questions to surface cache invalidation, failure modes, or auth decisions before implementing in an unfamiliar domain.</p>\n<p>When the same defect recurs across runs, change the prompt, schema, or examples. Per-instance retries do not generalize. Generated tests that only assert \"does not throw\" are low value — document fixtures and behavioral standards.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Use 2–3 input/output examples when prose is interpreted inconsistently.</li><li>Drive iteration from real test failures.</li><li>Use the interview pattern before implementing in unfamiliar domains.</li><li>Batch interacting issues; sequence independent ones.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"3.5\" data-n=\"1\"><p><strong>Q1.</strong> Two bugs interact; fixing one breaks the other. One message or sequential?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>One detailed message covering both. Sequential fixes will fight.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"3.5\" data-n=\"2\"><p><strong>Q2.</strong> Same defect on every retry of the same prompt. What now?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Change examples, schema, or criteria. Another blind retry will not generalize.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-12\">11. Iterative Refinement, Testing, and Evaluation</a></li></ul></div>", "search": "3.5 Iterative refinement \n<h3>Definition</h3>\n<p>Concrete input/output examples and failing tests beat prose. Claude improves fastest when feedback is executable.</p>\n<h3>How it works</h3>\n<p>Write tests or 2–3 examples first. Ask for the smallest useful implementation. Run tests. Feed exact failures (input, expected, actual, assertion). Iterate one failure class at a time unless issues interact — then send them in one detailed message because sequential fixes will fight each other.</p>\n<p>The interview pattern: have Claude ask questions to surface cache invalidation, failure modes, or auth decisions before implementing in an unfamiliar domain.</p>\n<p>When the same defect recurs across runs, change the prompt, schema, or examples. Per-instance retries do not generalize. Generated tests that only assert \"does not throw\" are low value — document fixtures and behavioral standards.</p>\n"}, {"id": "3.6", "title": "Claude Code in CI/CD", "html": "\n<h3>Definition</h3>\n<p>CI needs non-interactive, machine-readable, isolated review. A chat session attached to the authoring context is the wrong quality gate.</p>\n<h3>How it works</h3>\n<p>Use <code>-p</code> / <code>--print</code> so the process cannot hang on interactive input. Use <code>--output-format json</code> and <code>--json-schema</code> so findings can be posted as inline PR comments. Project CLAUDE.md supplies testing standards, fixture conventions, and review criteria to the CI-invoked process.</p>\n<p>The same session that generated code is less effective at reviewing it. Use an independent instance. When re-running after new commits, include prior findings and instruct Claude to report only new or still-unaddressed issues. Provide existing tests so generation does not duplicate coverage.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Run Claude Code in CI with -p.</li><li>Emit schema-constrained JSON for automation.</li><li>Avoid duplicate PR comments on re-review.</li><li>Ground test generation in existing tests and CLAUDE.md standards.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"3.6\" data-n=\"1\"><p><strong>Q1.</strong> CI Claude Code hangs waiting for input. Missing flag?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>-p / --print for non-interactive mode.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"3.6\" data-n=\"2\"><p><strong>Q2.</strong> Why not review in the same session that wrote the code?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>That context is biased toward its own plan. Use an independent instance and schema-shaped JSON.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li><li><a href=\"#ch-12\">11. Iterative Refinement, Testing, and Evaluation</a></li></ul></div>", "search": "3.6 Claude Code in CI/CD \n<h3>Definition</h3>\n<p>CI needs non-interactive, machine-readable, isolated review. A chat session attached to the authoring context is the wrong quality gate.</p>\n<h3>How it works</h3>\n<p>Use <code>-p</code> / <code>--print</code> so the process cannot hang on interactive input. Use <code>--output-format json</code> and <code>--json-schema</code> so findings can be posted as inline PR comments. Project CLAUDE.md supplies testing standards, fixture conventions, and review criteria to the CI-invoked process.</p>\n<p>The same session that generated code is less effective at reviewing it. Use an independent instance. When re-running after new commits, include prior findings and instruct Claude to report only new or still-unaddressed issues. Provide existing tests so generation does not duplicate coverage.</p>\n"}]}, {"id": "d4", "domain": "4", "weight": "20%", "title": "Domain 4 — Prompt Engineering & Structured Output", "kind": "domain", "tasks": [{"id": "4.1", "title": "Explicit criteria", "html": "\n<h3>Definition</h3>\n<p>Explicit criteria beat vague instructions. \"Flag comments only when claimed behavior contradicts actual code behavior\" is a criterion. \"Check that comments are accurate\" is not. \"Be conservative\" and \"only report high-confidence findings\" do not raise precision the way categorical rules do.</p>\n<p>High false-positive categories undermine trust in accurate categories. Temporarily disable the noisy category while you improve its prompt, rather than letting it poison the whole bot.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Define what to report vs skip, not just a confidence filter.</li><li>Disable high false-positive categories while repairing them.</li><li>Define severity with concrete examples per level.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"4.1\" data-n=\"1\"><p><strong>Q1.</strong> Review bot says &#x27;be conservative&#x27; and still nags about style. Better fix?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Explicit report vs skip categories. Optionally disable the noisy category while you repair it.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"4.1\" data-n=\"2\"><p><strong>Q2.</strong> Why do false positives in one category hurt the whole bot?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Developers stop trusting even the accurate categories.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-7\">6. System Prompt Engineering and Conversational Behavior</a></li><li><a href=\"#ch-12\">11. Iterative Refinement, Testing, and Evaluation</a></li></ul></div>", "search": "4.1 Explicit criteria \n<h3>Definition</h3>\n<p>Explicit criteria beat vague instructions. \"Flag comments only when claimed behavior contradicts actual code behavior\" is a criterion. \"Check that comments are accurate\" is not. \"Be conservative\" and \"only report high-confidence findings\" do not raise precision the way categorical rules do.</p>\n<p>High false-positive categories undermine trust in accurate categories. Temporarily disable the noisy category while you improve its prompt, rather than letting it poison the whole bot.</p>\n"}, {"id": "4.2", "title": "Few-shot prompting", "html": "\n<h3>Definition</h3>\n<p>Few-shot examples are usually the most effective way to get consistent format, handle ambiguous cases, and teach extraction from varied layouts. Two to four targeted examples beat a long rule list for subtle distinctions.</p>\n<h3>How to write them</h3>\n<p>Show complete input–output pairs. Show why one action was chosen over a plausible alternative. Show the exact output shape (location, issue, severity, suggested fix). Show acceptable code next to a genuine defect so the model generalizes instead of matching only listed cases. Show informal measurements extracted verbatim. Show inline citations versus bibliographies.</p>\n<p>When the same defect keeps recurring, add an example of the correct handling. That generalizes; another retry of the same prompt does not.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Write 2–4 examples for the actual ambiguous cases you fail.</li><li>Demonstrate format, not only prose rules.</li><li>Use contrast pairs to cut false positives without blocking novel true positives.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"4.2\" data-n=\"1\"><p><strong>Q1.</strong> Format is inconsistent despite a long rule list. Highest-leverage add?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Two to four complete examples, including the ambiguous case you actually fail.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"4.2\" data-n=\"2\"><p><strong>Q2.</strong> Are examples only for exact matching?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Contrast pairs teach generalization to novel but similar cases.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-5\">4. Structured Data Extraction and Validation</a></li><li><a href=\"#ch-7\">6. System Prompt Engineering and Conversational Behavior</a></li></ul></div>", "search": "4.2 Few-shot prompting \n<h3>Definition</h3>\n<p>Few-shot examples are usually the most effective way to get consistent format, handle ambiguous cases, and teach extraction from varied layouts. Two to four targeted examples beat a long rule list for subtle distinctions.</p>\n<h3>How to write them</h3>\n<p>Show complete input–output pairs. Show why one action was chosen over a plausible alternative. Show the exact output shape (location, issue, severity, suggested fix). Show acceptable code next to a genuine defect so the model generalizes instead of matching only listed cases. Show informal measurements extracted verbatim. Show inline citations versus bibliographies.</p>\n<p>When the same defect keeps recurring, add an example of the correct handling. That generalizes; another retry of the same prompt does not.</p>\n"}, {"id": "4.3", "title": "Structured output and schemas", "html": "\n<h3>Definition</h3>\n<p>Tool use with a JSON schema is the reliable way to get schema-shaped output. Prompt-only \"respond with JSON\" still produces fences, commentary, and drift. Schema compliance eliminates many syntax errors; it does not prevent semantic errors (line items that do not sum, values in the wrong field).</p>\n<p>Use JSON structured outputs (<code>output_config.format</code>) when the assistant's direct reply should be JSON. Use tool use when the structured object is a function call or extraction step. Assistant prefill to force <code>{</code> is legacy on current models.</p>\n<h3>Schema design</h3>\n<p>Make fields optional or nullable when the source may omit them — required fields pressure fabrication. Distinguish <code>null</code> (not stated) from <code>[]</code> (asked and found none). Add <code>unclear</code> or <code>other</code> plus a detail string for evolving categories. Include format-normalization rules in the prompt alongside the schema.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Define an extraction tool and read structured data from tool_use.input.</li><li>Use tool_choice any when document type is unknown; force a named tool for a required first stage.</li><li>Design nullable fields and other+detail enums so the model can be honest.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"4.3\" data-n=\"1\"><p><strong>Q1.</strong> Downstream inserts JSON into a database. Prompt-only JSON keeps growing fences. Fix?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Structured outputs or a forced extraction tool plus application validation.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"4.3\" data-n=\"2\"><p><strong>Q2.</strong> Source often omits lot size. Required number field. What happens?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>The model is pressured to fabricate. Make the field nullable and show a null example.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-2\">1. API Fundamentals and Output Control</a></li><li><a href=\"#ch-5\">4. Structured Data Extraction and Validation</a></li></ul></div>", "search": "4.3 Structured output and schemas \n<h3>Definition</h3>\n<p>Tool use with a JSON schema is the reliable way to get schema-shaped output. Prompt-only \"respond with JSON\" still produces fences, commentary, and drift. Schema compliance eliminates many syntax errors; it does not prevent semantic errors (line items that do not sum, values in the wrong field).</p>\n<p>Use JSON structured outputs (<code>output_config.format</code>) when the assistant's direct reply should be JSON. Use tool use when the structured object is a function call or extraction step. Assistant prefill to force <code>{</code> is legacy on current models.</p>\n<h3>Schema design</h3>\n<p>Make fields optional or nullable when the source may omit them — required fields pressure fabrication. Distinguish <code>null</code> (not stated) from <code>[]</code> (asked and found none). Add <code>unclear</code> or <code>other</code> plus a detail string for evolving categories. Include format-normalization rules in the prompt alongside the schema.</p>\n"}, {"id": "4.4", "title": "Validation and feedback loops", "html": "\n<h3>Definition</h3>\n<p>Retry-with-error-feedback: send the source, the failed extraction, and the exact validation errors. Blind retry of the same prompt is a weaker move. <code>temperature: 0</code> is not a substitute.</p>\n<p>Retries fix format and structural mismatches. They cannot invent facts that exist only in a document you never provided — retrieve or send to a human.</p>\n<p>Add reconciliation fields (<code>stated_total</code>, <code>calculated_total</code>, <code>conflict_detected</code>). For review agents, add <code>detected_pattern</code> so dismissed findings become prompt improvements.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Implement follow-up requests that include document + failed output + errors.</li><li>Recognize when retry cannot help.</li><li>Instrument findings so false-positive patterns are visible.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"4.4\" data-n=\"1\"><p><strong>Q1.</strong> Schema is valid but line items do not sum. Next request should include?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>The source, the failed extract, and the exact validation errors — not the same prompt again.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"4.4\" data-n=\"2\"><p><strong>Q2.</strong> Fact lives only in a PDF you never sent. Retry?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Retrieve the document or send to a human. Retry cannot invent the source.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-5\">4. Structured Data Extraction and Validation</a></li><li><a href=\"#ch-12\">11. Iterative Refinement, Testing, and Evaluation</a></li></ul></div>", "search": "4.4 Validation and feedback loops \n<h3>Definition</h3>\n<p>Retry-with-error-feedback: send the source, the failed extraction, and the exact validation errors. Blind retry of the same prompt is a weaker move. <code>temperature: 0</code> is not a substitute.</p>\n<p>Retries fix format and structural mismatches. They cannot invent facts that exist only in a document you never provided — retrieve or send to a human.</p>\n<p>Add reconciliation fields (<code>stated_total</code>, <code>calculated_total</code>, <code>conflict_detected</code>). For review agents, add <code>detected_pattern</code> so dismissed findings become prompt improvements.</p>\n"}, {"id": "4.5", "title": "Batch processing", "html": "\n<h3>Definition</h3>\n<p>The Message Batches API is about 50% cheaper and can take up to 24 hours. There is no guaranteed low-latency SLA. Results are unordered — join by <code>custom_id</code>. A batch request cannot run a multi-turn tool loop inside a single item.</p>\n<p>Appropriate: overnight reports, weekly audits, nightly test generation. Inappropriate: blocking pre-merge checks and anything a user is waiting on.</p>\n<h3>SLA cadence</h3>\n<p>Worst case ≈ time until the next submission + batch window (up to 24h) + post-processing. If the SLA is 30 hours and post-processing is 4 hours, cadence can be at most 2 hours. A single midnight batch misses documents that arrive just after submission.</p>\n<p>Resubmit only failed ids. Chunk context-length failures. Sample and refine prompts before a huge first batch when you expect iteration. Official exam scope: know that prompt caching exists; you do not need caching implementation internals.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Match real-time vs batch to latency requirements.</li><li>Calculate submission frequency from SLA − 24h − processing buffer.</li><li>Resubmit only failed custom_id records, with chunking or prompt fixes as needed.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"4.5\" data-n=\"1\"><p><strong>Q1.</strong> Pre-merge test gate. Batch or real-time?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Real-time. Batch has no low-latency SLA and no mid-request tool loop.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"4.5\" data-n=\"2\"><p><strong>Q2.</strong> 30h SLA, 24h batch window, 4h post-process. Max submit gap?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>2 hours. Worst case is miss-the-batch wait + 24 + 4.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-15\">14. Batch Processing, Cost, and Latency</a></li><li><a href=\"#ch-14\">13. Prompt Caching</a></li></ul></div>", "search": "4.5 Batch processing \n<h3>Definition</h3>\n<p>The Message Batches API is about 50% cheaper and can take up to 24 hours. There is no guaranteed low-latency SLA. Results are unordered — join by <code>custom_id</code>. A batch request cannot run a multi-turn tool loop inside a single item.</p>\n<p>Appropriate: overnight reports, weekly audits, nightly test generation. Inappropriate: blocking pre-merge checks and anything a user is waiting on.</p>\n<h3>SLA cadence</h3>\n<p>Worst case ≈ time until the next submission + batch window (up to 24h) + post-processing. If the SLA is 30 hours and post-processing is 4 hours, cadence can be at most 2 hours. A single midnight batch misses documents that arrive just after submission.</p>\n<p>Resubmit only failed ids. Chunk context-length failures. Sample and refine prompts before a huge first batch when you expect iteration. Official exam scope: know that prompt caching exists; you do not need caching implementation internals.</p>\n"}, {"id": "4.6", "title": "Multi-instance and multi-pass review", "html": "\n<h3>Definition</h3>\n<p>A model retains reasoning context from generation, so it is less likely to question its own decisions in the same session. An independent instance without that context is more effective than self-review instructions or extended thinking in the authoring chat.</p>\n<p>Multi-pass review: per-file local analysis plus a separate cross-file integration pass. That avoids attention dilution and contradictory findings on large PRs.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Use a second Claude instance to review generated code.</li><li>Split large reviews into local plus integration passes.</li><li>Optionally emit calibrated confidence for routing humans — after you measure it.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"4.6\" data-n=\"1\"><p><strong>Q1.</strong> Same chat writes code then &#x27;reviews&#x27; it. Why is that weak?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>It still has the authoring rationale. Use a cold instance plus local then integration passes.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"4.6\" data-n=\"2\"><p><strong>Q2.</strong> One pass over a 40-file PR. Risk?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Attention dilution and contradictory findings. Split local vs cross-file.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-9\">8. Agentic Patterns and Task Decomposition</a></li><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li><li><a href=\"#ch-12\">11. Iterative Refinement, Testing, and Evaluation</a></li></ul></div>", "search": "4.6 Multi-instance and multi-pass review \n<h3>Definition</h3>\n<p>A model retains reasoning context from generation, so it is less likely to question its own decisions in the same session. An independent instance without that context is more effective than self-review instructions or extended thinking in the authoring chat.</p>\n<p>Multi-pass review: per-file local analysis plus a separate cross-file integration pass. That avoids attention dilution and contradictory findings on large PRs.</p>\n"}]}, {"id": "d5", "domain": "5", "weight": "15%", "title": "Domain 5 — Context Management & Reliability", "kind": "domain", "tasks": [{"id": "5.1", "title": "Preserving critical context", "html": "\n<h3>Definition</h3>\n<p>Context management is state management. The model sees a request, not your database. A large window is not the same as attention: models process beginnings and ends more reliably than middles (lost-in-the-middle). Progressive summaries blur numbers, dates, and customer-stated expectations if you let them.</p>\n<h3>How to preserve the right things</h3>\n<p>Extract transactional facts (amounts, dates, order numbers, statuses) into a persistent case-facts block included in every prompt, outside the summarized history. For multi-issue sessions, keep structured issue state per item. Trim verbose tool outputs to the fields that matter before they accumulate. Place key findings at the beginning of aggregated inputs and section-header the rest.</p>\n<p>You must send the conversation you want remembered. There is no magic memory flag. API compaction and context editing can keep a long session alive; application-level structured state controls what must survive verbatim.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Keep exact facts in a structured block, not only in a prose summary.</li><li>Compress tool results before they dominate context.</li><li>Order aggregated inputs to mitigate position effects.</li><li>Require dates, sources, and method notes in specialist outputs.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"5.1\" data-n=\"1\"><p><strong>Q1.</strong> Allergy stated on turn 3, session is turn 50. Sliding window doubled. Still safe?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Keep allergies in a persistent reference / state object; do not rely on a longer window.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"5.1\" data-n=\"2\"><p><strong>Q2.</strong> lookup_order returns 40 fields every turn. What crowds out the case?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Uncompressed tool results. Keep the five fields you need.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-6\">5. Conversation Context Management</a></li></ul></div>", "search": "5.1 Preserving critical context \n<h3>Definition</h3>\n<p>Context management is state management. The model sees a request, not your database. A large window is not the same as attention: models process beginnings and ends more reliably than middles (lost-in-the-middle). Progressive summaries blur numbers, dates, and customer-stated expectations if you let them.</p>\n<h3>How to preserve the right things</h3>\n<p>Extract transactional facts (amounts, dates, order numbers, statuses) into a persistent case-facts block included in every prompt, outside the summarized history. For multi-issue sessions, keep structured issue state per item. Trim verbose tool outputs to the fields that matter before they accumulate. Place key findings at the beginning of aggregated inputs and section-header the rest.</p>\n<p>You must send the conversation you want remembered. There is no magic memory flag. API compaction and context editing can keep a long session alive; application-level structured state controls what must survive verbatim.</p>\n"}, {"id": "5.2", "title": "Escalation and ambiguity", "html": "\n<h3>Definition</h3>\n<p>Escalate when the customer explicitly wants a human (honor immediately if you cannot finish without overriding them), when policy is silent or requires an exception, when you cannot make meaningful progress, or when state is uncertain/unsafe. Do not escalate on a turn counter, sentiment score, or uncalibrated self-confidence.</p>\n<p>If the issue is straightforward and the user is frustrated, acknowledge the frustration and offer to finish now while preserving their choice. Do not silently take account actions after they asked for a person.</p>\n<p>Multiple customer matches require another identifier, not a heuristic pick. Ask one focused clarifying question when the action is high impact. State assumptions when risk is low. Surface conflicting goals; do not average them.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Put explicit escalation criteria and few-shot examples in the prompt.</li><li>Honor explicit human requests; offer resolution when the case is simple and they are frustrated.</li><li>Escalate policy gaps instead of inventing policy.</li><li>Clarify ambiguous entity matches instead of guessing.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"5.2\" data-n=\"1\"><p><strong>Q1.</strong> User is angry but the credit is clearly allowed. Immediate escalate?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Acknowledge, offer to finish now, keep their choice. Escalate if they still want a human or policy is silent.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"5.2\" data-n=\"2\"><p><strong>Q2.</strong> Three &#x27;Alex Smith&#x27; rows. Pick the newest?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Ask for another identifier. Do not heuristic-guess a refund target.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-10\">9. Customer Service and Production Workflow Design</a></li><li><a href=\"#ch-7\">6. System Prompt Engineering and Conversational Behavior</a></li></ul></div>", "search": "5.2 Escalation and ambiguity \n<h3>Definition</h3>\n<p>Escalate when the customer explicitly wants a human (honor immediately if you cannot finish without overriding them), when policy is silent or requires an exception, when you cannot make meaningful progress, or when state is uncertain/unsafe. Do not escalate on a turn counter, sentiment score, or uncalibrated self-confidence.</p>\n<p>If the issue is straightforward and the user is frustrated, acknowledge the frustration and offer to finish now while preserving their choice. Do not silently take account actions after they asked for a person.</p>\n<p>Multiple customer matches require another identifier, not a heuristic pick. Ask one focused clarifying question when the action is high impact. State assumptions when risk is low. Surface conflicting goals; do not average them.</p>\n"}, {"id": "5.3", "title": "Error propagation in multi-agent systems", "html": "\n<h3>Definition</h3>\n<p>Structured error context (failure type, attempted query, partial results, alternatives) lets the coordinator recover. Generic \"search unavailable\" hides that context. Silently turning failures into empty success, or killing the whole workflow on one specialist failure, are both wrong.</p>\n<p>Access failures (timeouts) need retry decisions. Valid empty results are successful queries with no matches. Subagents retry transients locally and propagate only what they cannot fix. Synthesis should annotate coverage: well-supported versus gaps because a source was down.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Return structured failure context with partial results.</li><li>Distinguish access failure from empty success.</li><li>Recover locally first; annotate coverage gaps in the final output.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"5.3\" data-n=\"1\"><p><strong>Q1.</strong> Specialist times out. Coordinator sees &#x27;unavailable&#x27;. What is missing?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Failure type, query attempted, partial hits, alternatives. Generic status blocks recovery.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"5.3\" data-n=\"2\"><p><strong>Q2.</strong> One source is down. Kill the whole research workflow?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Continue with partials and annotate the coverage gap.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-4\">3. Error Handling in Agent Tools</a></li><li><a href=\"#ch-9\">8. Agentic Patterns and Task Decomposition</a></li></ul></div>", "search": "5.3 Error propagation in multi-agent systems \n<h3>Definition</h3>\n<p>Structured error context (failure type, attempted query, partial results, alternatives) lets the coordinator recover. Generic \"search unavailable\" hides that context. Silently turning failures into empty success, or killing the whole workflow on one specialist failure, are both wrong.</p>\n<p>Access failures (timeouts) need retry decisions. Valid empty results are successful queries with no matches. Subagents retry transients locally and propagate only what they cannot fix. Synthesis should annotate coverage: well-supported versus gaps because a source was down.</p>\n"}, {"id": "5.4", "title": "Large codebase exploration", "html": "\n<h3>Definition</h3>\n<p>In long sessions models start giving inconsistent answers and referring to \"typical patterns\" instead of the specific classes they already found. Persist findings outside the rolling transcript.</p>\n<h3>How it works</h3>\n<p>Scratchpad files record key files, data flow, open questions, confirmed assumptions, risks, and next steps. Spawn subagents for \"find all tests\" or \"trace refund-flow dependencies\" while the parent coordinates. Summarize one phase before spawning the next. On crash, load a structured manifest and inject slices into prompts. Use <code>/compact</code> when discovery output fills the window.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Delegate verbose exploration to subagents.</li><li>Maintain and reread scratchpads.</li><li>Inject phase summaries into later agents.</li><li>Design crash recovery with manifests, not raw transcript replay.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"5.4\" data-n=\"1\"><p><strong>Q1.</strong> After 80 turns the model cites &#x27;typical service patterns&#x27; instead of PaymentService.</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Context decay. Persist a scratchpad and reread it; delegate verbose grepping to a subagent.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"5.4\" data-n=\"2\"><p><strong>Q2.</strong> Crash mid-exploration. Replay every tool payload?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Load a structured manifest and inject only the relevant slice.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-11\">10. Claude Code and Claude Agent SDK Workflows</a></li><li><a href=\"#ch-6\">5. Conversation Context Management</a></li></ul></div>", "search": "5.4 Large codebase exploration \n<h3>Definition</h3>\n<p>In long sessions models start giving inconsistent answers and referring to \"typical patterns\" instead of the specific classes they already found. Persist findings outside the rolling transcript.</p>\n<h3>How it works</h3>\n<p>Scratchpad files record key files, data flow, open questions, confirmed assumptions, risks, and next steps. Spawn subagents for \"find all tests\" or \"trace refund-flow dependencies\" while the parent coordinates. Summarize one phase before spawning the next. On crash, load a structured manifest and inject slices into prompts. Use <code>/compact</code> when discovery output fills the window.</p>\n"}, {"id": "5.5", "title": "Human review and confidence", "html": "\n<h3>Definition</h3>\n<p>Aggregate accuracy (97% overall) can hide an 80% field or document type. Self-reported confidence is useful only after calibration on a labeled set. Stratified random sampling of high-confidence outputs detects novel error patterns after you automate.</p>\n<p>Do not set an auto-approval threshold until you have segmented accuracy and calibrated scores. After launch, keep sampling — downstream complaints are a lagging, incomplete instrument. Tools should return a derived <code>requires_review</code> plus reasons, not a raw score for the model to interpret.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Segment accuracy before reducing human review.</li><li>Calibrate field-level confidence on labeled data.</li><li>Route low confidence and contradictory sources to humans.</li><li>Stratified-sample high-confidence outputs after automation.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"5.5\" data-n=\"1\"><p><strong>Q1.</strong> Pipeline is 96.5% accurate. Auto-approve high confidence now?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Not until you segment by document type/field and calibrate scores. Then keep stratified sampling.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"5.5\" data-n=\"2\"><p><strong>Q2.</strong> Model says confidence 0.92. Is that 92% accurate?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Only after you measure it on labeled data. Uncalibrated scores are not a gate.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-5\">4. Structured Data Extraction and Validation</a></li><li><a href=\"#ch-12\">11. Iterative Refinement, Testing, and Evaluation</a></li></ul></div>", "search": "5.5 Human review and confidence \n<h3>Definition</h3>\n<p>Aggregate accuracy (97% overall) can hide an 80% field or document type. Self-reported confidence is useful only after calibration on a labeled set. Stratified random sampling of high-confidence outputs detects novel error patterns after you automate.</p>\n<p>Do not set an auto-approval threshold until you have segmented accuracy and calibrated scores. After launch, keep sampling — downstream complaints are a lagging, incomplete instrument. Tools should return a derived <code>requires_review</code> plus reasons, not a raw score for the model to interpret.</p>\n"}, {"id": "5.6", "title": "Provenance and uncertainty", "html": "\n<h3>Definition</h3>\n<p>Source attribution dies in summarization unless you pass structured claim–source mappings. Conflicting statistics from credible sources should be annotated, not averaged or arbitrarily picked. Temporal data needs publication or collection dates so 2019 and 2025 figures are a trend, not a contradiction.</p>\n<p>Each research specialist should emit claim, source id and location, date, method notes, uncertainty language, and whether the finding is established, contested, or insufficient. The synthesizer preserves and merges those records and reports coverage gaps.</p>\n<p>Security sits beside reliability: model output is untrusted to your systems; retrieved pages are untrusted to the model. Private data + untrusted content + an outbound channel is an exfiltration path. Remove or gate one leg. Keep secrets out of prompts.</p>\n<div class=\"card ok\"><div class=\"kicker\">You must be able to</div><ul><li>Preserve claim–source maps across agents.</li><li>Annotate conflicts with attribution.</li><li>Require dates on numerical claims.</li><li>Report coverage gaps instead of papering over missing sources.</li></ul></div><h3>Self-check</h3><p class=\"meta\">Reveal the answer, then mark Missed if you would have gotten it wrong. Those items show up more often in Drill.</p><div class=\"check\" data-task=\"5.6\" data-n=\"1\"><p><strong>Q1.</strong> Two credible sources disagree on a percentage. Pick the newer one?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>No. Keep both with attribution and dates. Mark the finding contested.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"check\" data-task=\"5.6\" data-n=\"2\"><p><strong>Q2.</strong> Report writer got only an executive summary and must cite. Why will it fail?</p><button type=\"button\" class=\"btn btn-reveal reveal\">Show answer</button><div class=\"answer hidden\"><p>Citations died in the summary. Pass claim–source–date records.</p></div><div class=\"grade hidden\"><button type=\"button\" class=\"btn btn-warn miss\">Missed</button></div></div><div class=\"card rule\"><div class=\"kicker\">Deeper reading (optional)</div><p>This task page is the compressed exam lesson: every distinction you need, without the long teaching prose. If a point still feels fuzzy, open the unabridged chapter. Full chapters were not shortened.</p><ul><li><a href=\"#ch-9\">8. Agentic Patterns and Task Decomposition</a></li><li><a href=\"#ch-5\">4. Structured Data Extraction and Validation</a></li><li><a href=\"#ch-16\">15. Security and Trust Boundaries</a></li></ul></div>", "search": "5.6 Provenance and uncertainty \n<h3>Definition</h3>\n<p>Source attribution dies in summarization unless you pass structured claim–source mappings. Conflicting statistics from credible sources should be annotated, not averaged or arbitrarily picked. Temporal data needs publication or collection dates so 2019 and 2025 figures are a trend, not a contradiction.</p>\n<p>Each research specialist should emit claim, source id and location, date, method notes, uncertainty language, and whether the finding is established, contested, or insufficient. The synthesizer preserves and merges those records and reports coverage gaps.</p>\n<p>Security sits beside reliability: model output is untrusted to your systems; retrieved pages are untrusted to the model. Private data + untrusted content + an outbound channel is an exfiltration path. Remove or gate one leg. Keep secrets out of prompts.</p>\n"}]}, {"id": "ch-1", "title": "Overview of the teaching guide", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>Overview</h2><p>This guide teaches the architecture knowledge needed to design, build, and operate production systems with Claude, Claude Code, the Claude Agent SDK, tools, and MCP integrations. It is intentionally scenario-oriented: the exam is likely to test trade-offs, not rote definitions.</p>\n<p>The most important habit is to ask: where should responsibility live?</p>\n<ul><li>The model is good at interpreting language, choosing among well-described options, synthesizing evidence, and adapting plans.</li><li>Application code is responsible for deterministic guarantees: permissions, compliance thresholds, state persistence, retries, idempotency, validation, and auditability.</li><li>Tool and schema design shape the model&#x27;s behavior. A vague tool or underspecified schema creates model errors that look like &quot;reasoning&quot; failures but are really interface failures.</li></ul>\n<p>This guide avoids exam-question content. The examples are original teaching examples that illustrate the underlying concepts.</p>", "search": "Overview This guide teaches the architecture knowledge needed to design, build, and operate production systems with Claude, Claude Code, the Claude Agent SDK, tools, and MCP integrations. It is intentionally scenario-oriented: the exam is likely to test trade-offs, not rote definitions.\n\nThe most important habit is to ask: where should responsibility live?\n\n- The model is good at interpreting language, choosing among well-described options, synthesizing evidence, and adapting plans.\n- Application code is responsible for deterministic guarantees: permissions, compliance thresholds, state persistence, retries, idempotency, validation, and auditability.\n- Tool and schema design shape the model's behavior. A vague tool or underspecified schema creates model errors that look like \"reasoning\" failures but are really interface failures.\n\nThis guide avoids exam-question content. The examples are original teaching examples that illustrate the underlying concepts.\n\n---"}, {"id": "ch-2", "title": "Chapter 1 — API fundamentals", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>1. API Fundamentals and Output Control</h2><h3>What to Know</h3>\n<p>Claude&#x27;s Messages API is stateless. Claude does not remember previous API calls unless your application includes the relevant content in the next request. A production chat application must store the conversation and send the full current context on each turn: the system prompt, the selected prior messages, current application state, retrieved documents, and any tool results the model needs.</p>\n<p>There is no magic memory flag that makes Claude remember earlier turns. A <code>session_id</code> in your own product, database, or orchestration layer can help you find stored history, but the model only sees what the request contains. If an assistant forgets facts from two turns ago in a short conversation, the most likely cause is that the application is not sending those prior messages.</p>\n<p>As conversations grow, two things happen:</p>\n<ul><li>Input token cost and latency increase because more context is sent every turn.</li><li>The model has more competing information to attend to, including older user preferences, stale tool results, verbose RAG results, and its own earlier responses.</li></ul>\n<p>The Messages API uses a top-level <code>system</code> parameter for system prompts, not a <code>&quot;system&quot;</code> role inside <code>messages</code>. User and assistant turns go in <code>messages</code>. Tool use is represented with content blocks: assistant messages can contain <code>tool_use</code> blocks, and user messages can contain <code>tool_result</code> blocks.</p>\n<h3>Structured Outputs and Tool Use as Output Control</h3>\n<p>Claude has two related ways to get machine-readable output:</p>\n<ul><li><strong>JSON structured outputs</strong> use <code>output_config.format</code> with a JSON Schema. Claude&#x27;s direct text response is constrained to valid JSON matching that schema.</li><li><strong>Tool use / strict tool use</strong> constrains tool calls. You can define a tool with an input schema and read the model&#x27;s <code>tool_use.input</code> as structured data, or use <code>strict: true</code> where supported to enforce tool-parameter schema compliance.</li></ul>\n<p>Use JSON structured outputs when the final assistant response itself should be JSON. Use tool use when the structured output represents a function call, extraction step, or intermediate agent action. These can be combined in workflows where the agent must both call tools with valid parameters and produce a structured final response.</p>\n<p>For exam-style architecture questions, the key principle is stable: schema-backed output is more reliable than asking for free-form text that &quot;looks like JSON.&quot;</p>\n<p><code>tool_choice</code> matters:</p>\n<table><tr><th>Setting</th><th>Meaning</th><th>Use Case</th></tr><tr><td><code>auto</code></td><td>Claude may call a tool or answer normally</td><td>General agents where tool use is optional</td></tr><tr><td><code>any</code></td><td>Claude must call one of the provided tools</td><td>Extraction where the document type is unknown but one extraction tool from a defined set must be used</td></tr><tr><td><code>tool</code></td><td>Claude must call a specific named tool</td><td>A pipeline stage that must produce one schema before enrichment</td></tr><tr><td><code>none</code></td><td>Claude cannot call tools</td><td>Pure text response or a step where tools are unsafe/unneeded</td></tr></table>\n<p><code>tool_choice: &quot;any&quot;</code> is especially useful when you have several extraction tools (one per document type) and you want guaranteed tool use without choosing which schema in advance. Setting <code>auto</code> with prompt instructions to &quot;use a tool&quot; can still produce conversational text in edge cases; <code>any</code> cannot.</p>\n<p>When multiple tools are available but one must run first, use <code>tool_choice</code> with a specific tool name (e.g., <code>{&quot;type&quot;: &quot;tool&quot;, &quot;name&quot;: &quot;extract_metadata&quot;}</code>) for the first call, receive the structured result, then make subsequent calls for enrichment. Reordering tool definitions or relying on system prompt priority is unreliable.</p>\n<p>For extraction systems, common patterns are:</p>\n<ol><li>Use <code>output_config.format</code> with a JSON Schema when you want the response body to be validated JSON.</li><li>Define an extraction tool whose input schema is the desired output schema when the extraction is modeled as a tool call.</li><li>Set <code>tool_choice</code> to a required tool or to <code>any</code> across several extraction tools when a tool call must happen.</li><li>Validate the result in application code.</li><li>If semantic validation fails, call Claude again with the source, the invalid extraction, and the validation errors. This validation-error feedback loop is far more effective than retrying the same prompt unchanged.</li></ol>\n<p>Tool definitions, tool schemas, output schemas, and tool-use/result blocks count as input tokens or add injected prompt overhead. A large schema (for example, a 12-field tool definition with detailed descriptions consuming ~2,500 tokens) combined with a long document can approach the context limit. When that happens, accuracy degrades on content near the end of the document because the model is processing close to the effective attention boundary. The root cause is total context consumption, not a model defect.</p>\n<p>Structured outputs also have operational implications: the first request for a schema may have additional latency while the grammar is compiled; schemas are cached for reuse; very complex schemas can exceed compilation limits; refusals or max-token stops can still produce nonconforming output. Do not treat schema compliance as a substitute for domain validation.</p>\n<h3>Partial Assistant Prefill (Legacy)</h3>\n<p>Older Claude models allowed a request to end with a partially filled assistant message, and the model would continue from it. Teams used this to force output shapes (start the reply with <code>{</code>) or to suppress repetitive greetings. Treat this as a legacy technique: on current-generation models (the Claude 4.6 family and later), a request whose final message is an assistant turn returns a validation error instead of a continuation. Assistant messages placed <em>earlier</em> in the conversation — for example, as few-shot examples — remain valid everywhere.</p>\n<p>Use the modern replacements:</p>\n<table><tr><th>Prefill was used for</th><th>Replacement</th></tr><tr><td>Forcing JSON or schema-shaped output</td><td><code>output_config.format</code> structured outputs, or a forced tool call</td></tr><tr><td>Forcing a classification label</td><td>An enum field in a tool or output schema</td></tr><tr><td>Suppressing boilerplate openers (&quot;Here is the summary:&quot;)</td><td>A system prompt instruction to respond directly without preamble</td></tr><tr><td>Continuing an interrupted response</td><td>A user turn quoting the partial output and asking the model to continue from there</td></tr></table>\n<p>The architecture lesson is unchanged: schema-backed output beats string-steering. If a design option proposes prefill to guarantee format on a current model, prefer structured outputs or tool use.</p>\n<h3>Token Growth in Extended Conversations</h3>\n<p>Each new turn includes the entire conversation history in the request. As conversations grow:</p>\n<ul><li>Input token count rises with every message.</li><li>Latency rises proportionally because the model must attend to more input.</li><li>Per-turn cost rises.</li></ul>\n<p>If users notice slower responses and higher costs in long sessions, the cause is almost always input token growth, not a defect in the model or database. Context management strategies (sliding window, progressive summarization, structured state) address this directly.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Assuming Claude has persistent memory.</strong> It does not. Your app manages state and history.</li><li><strong>Treating <code>session_id</code> as model memory.</strong> A session identifier can locate stored context in your system, but it does not automatically change what Claude sees.</li><li><strong>Forcing text JSON with prompt instructions when tool use is available.</strong> Prompt-only JSON is more fragile than schema-backed tool use.</li><li><strong>Ignoring tool-definition token cost.</strong> Large tool schemas reduce the remaining budget for documents, conversation, and outputs.</li><li><strong>Confusing <code>tool_choice: &quot;auto&quot;</code> with required tool use.</strong> <code>auto</code> allows tools; only <code>any</code> or a named tool guarantees a tool call.</li></ul>\n<h3>Original Example</h3>\n<p>Suppose a maintenance repo
