ties.</p>\n<h3>Tool Discovery and Selection</h3>\n<p>Tools from connected MCP servers are discovered and exposed to the model through the client/host. When multiple servers are connected, the agent typically sees a combined tool registry. Good descriptions are critical because MCP tools compete with built-in tools and other server tools.</p>\n<p>If the agent ignores a specialized MCP tool and uses generic search or shell commands instead, the most likely fix is to improve the MCP tool description:</p>\n<ul><li>Explain when the tool is preferable to generic alternatives.</li><li>Describe inputs and outputs.</li><li>Include examples.</li><li>Mention key capabilities such as transitive dependency analysis, ranking, source metadata, or safe refactoring.</li></ul>\n<p>Do not first remove all competing tools. The agent often needs generic tools too.</p>\n<h3>Tool Annotations and Trust</h3>\n<p>MCP tool annotations are metadata that servers may include alongside their tool definitions. The standard hints include <code>readOnlyHint</code> (the tool does not modify state), <code>destructiveHint</code> (the tool may make irreversible changes), <code>idempotentHint</code> (calling the tool twice with the same input has the same effect as calling it once), and <code>openWorldHint</code> (the tool reaches external systems whose behavior the host cannot fully predict). These hints help the host build sensible UI affordances — for example, auto-allowing read-only tools, warning on destructive ones, suppressing repeat-confirmation on idempotent ones.</p>\n<p><strong>Annotations are not a security boundary.</strong> A malicious or buggy server can advertise <code>readOnlyHint: true</code> for a tool that deletes data. The host must treat annotations as untrusted hints and base actual permission and confirmation decisions on the server&#x27;s trust level, the user&#x27;s policy, the tool&#x27;s identity, and the operation&#x27;s real risk. A typical correct policy: use annotations to choose which prompt to show, but never use them to skip a security check that policy requires.</p>\n<h3>MCP Error Handling</h3>\n<p>MCP distinguishes two error tiers, and using the wrong one is a common bug:</p>\n<ul><li><strong>JSON-RPC protocol errors</strong> are returned when the request itself is invalid or the tool cannot be invoked at all: missing required parameters, unknown method, malformed JSON, parameter type mismatches. The client treats these as protocol-level failures, not as something to relay to the model as if the tool had run.</li><li><strong>Tool result with <code>isError: true</code></strong> is returned when the tool ran but failed semantically: a remote 404, a 503 from an upstream service, a permission denial, a validation rejection from the underlying system. The model sees these as tool results and can adapt — retry, choose a different tool, or surface to the user.</li></ul>\n<p>A useful rule: if the failure happened before the tool&#x27;s business logic could execute, return a JSON-RPC protocol error. If the tool reached its target system and that system or the operation itself failed, return a tool result with <code>isError: true</code> and a useful message. Putting a missing-parameter failure in <code>isError</code> confuses the agent into retrying with the same bad call; putting a remote 503 into a JSON-RPC error prevents the agent from trying again later.</p>\n<p>For resources, servers should validate URIs and return appropriate JSON-RPC errors for not found or internal failures. For tools that wrap inherently flaky network calls, lean toward <code>isError: true</code> with a clear message so the agent can decide whether to retry, switch tools, or escalate.</p>\n<h3>Tool Search and Progressive Availability</h3>\n<p>Hosts can expose dozens of MCP servers, and presenting all their tools at once would consume a large fraction of the context window before any work begins. Two coordinating mechanisms exist:</p>\n<ul><li><strong>Tool search / progressive availability.</strong> The host shows the agent a small surface initially and lets it pull additional tool definitions on demand based on the current task. The agent only spends tokens on tools it is about to use.</li><li><strong><code>list_changed</code> notifications.</strong> A server can notify clients that its tool set has changed (a server connected, a feature flag flipped, a permission changed). The client refreshes its tool list and the agent can pick up the new capability without a session restart.</li></ul>\n<p>When designing an MCP server intended for a host with progressive availability, pay extra attention to descriptions and names: the agent may discover the tool through search, so the description must read well in isolation, not only when listed alongside its siblings.</p>\n<h3>MCP in Claude Code</h3>\n<p>Claude Code can configure MCP servers at several scopes. The scope determines where the configuration lives, who can see it, and which copy wins when names collide:</p>\n<table><tr><th>Scope</th><th>Storage</th><th>Visibility</th><th>Typical Use</th></tr><tr><td>Project</td><td><code>.mcp.json</code> at the repository root, checked into version control</td><td>Everyone who clones the repo</td><td>Tools the whole team needs to do the project&#x27;s work — internal documentation servers, project-specific test runners, build orchestration</td></tr><tr><td>Local</td><td>An entry inside <code>~/.claude.json</code> keyed to the current project path</td><td>Only the current user, only when working in that project</td><td>Sensitive credentials for personal accounts, experimental servers under evaluation, project-specific tooling not yet ready to share</td></tr><tr><td>User</td><td>A separate entry in <code>~/.claude.json</code> not tied to a project</td><td>Only the current user, in any project they work on</td><td>Personal productivity tools — calendar, email, notes, clipboard — that the user wants available everywhere</td></tr></table>\n<p>When the same server name exists at multiple scopes, Claude Code connects to it once, using the highest-precedence definition: <strong>local &gt; project &gt; user</strong>. The entire winning entry is used; fields are not merged across scopes. The ordering is deliberate: a developer&#x27;s local definition overrides the team-shared <code>.mcp.json</code>, so you can point a server at a staging endpoint or test a modified configuration without editing the file everyone else uses. Use project scope deliberately because it is shared. Avoid putting personal credentials in project scope — those belong in local or user scope, where they remain on the developer&#x27;s machine.</p>\n<p>A nuance worth remembering for the exam: local and user scopes both live inside <code>~/.claude.json</code>, but at different keys. They are not &quot;the same scope with different names&quot; — local entries are scoped to a project path, user entries are global to the user. Selecting the wrong scope for a personal tool can leak credentials into a shared repo or, conversely, hide a tool the developer expected to see in every project.</p>\n<p>MCP prompts surface as slash commands in Claude Code. The slash-command name typically follows a <code>mcp__&lt;server&gt;__&lt;prompt&gt;</code> pattern so the user can disambiguate prompts coming from different servers. MCP output can be large; tool authors should control output size and offer pagination or summarization affordances so a single tool call does not crowd out the rest of the conversation.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Using a tool where a resource is better.</strong> Catalogs and schemas are often resources, not tools.</li><li><strong>Assuming MCP handles auth and retries automatically.</strong> It is a protocol, not a complete middleware platform.</li><li><strong>Trusting self-reported annotations.</strong> Trust the server and your policy controls.</li><li><strong>Writing minimal descriptions.</strong> &quot;Analyzes code&quot; is not enough.</li></ul>", "search": "7. Model Context Protocol (MCP) ### What to Know\n\nMCP is an open standard for connecting AI applications to external systems. An MCP server exposes capabilities; MCP clients connect to servers; the host application decides how users and models interact with those capabilities.\n\nMCP provides three important server-side building blocks:\n\n| MCP Feature | Who Controls It | Purpose |\n|---|---|---|\n| Tools | Model-controlled | Actions and computations the model may invoke |\n| Resources | Application-controlled | Context such as files, schemas, catalogs, or documents |\n| Prompts | User/application-controlled | Reusable prompt templates or workflows |\n\nUse tools for actions: search, update, create, analyze, send, calculate.\n\nUse resources for passive context: database schemas, documentation trees, issue summaries, file catalogs, API references. Resources reduce exploratory tool calls because the agent can see what information exists before acting.\n\nUse prompts for reusable workflows: review checklists, report templates, investigation playbooks.\n\nA common design question is \"should this be a resource, a tool, or a separate aggregator?\" The default decision rule:\n\n- If the content is reference material the agent might want to consult before acting (database schemas, API specs, file catalogs, project guidelines, configuration), expose it as a **resource**. The agent reads it like context; no tool call is needed beyond the resource fetch.\n- If the content is dynamic and requires computation or external lookup at the moment of use (the current state of an order, the result of a query against live data), expose it as a **tool**.\n- If the agent is overwhelmed by similar tools across many servers, the right fix is improving descriptions and using progressive availability — not consolidating everything behind a single \"natural language entry tool\" that re-routes to the underlying tools. That kind of aggregator hides the real tool surface from the model and tends to produce worse selection, not better.\n\nResources a"}, {"id": "ch-9", "title": "Chapter 8 — Agentic patterns", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>8. Agentic Patterns and Task Decomposition</h2><h3>What to Know</h3>\n<p>Agentic applications run a loop: observe, reason, act, observe again. The model sees current context, chooses a tool or response, incorporates results, and continues until the task is done or blocked.</p>\n<p>The architecture question is how much autonomy to give the model and how to structure the work.</p>\n<h3>Core Patterns</h3>\n<table><tr><th>Pattern</th><th>Best For</th><th>Avoid When</th></tr><tr><td>Prompt chaining</td><td>Fixed workflows with known steps</td><td>The path depends heavily on findings</td></tr><tr><td>Routing</td><td>Inputs fall into distinct handling categories</td><td>Categories are fuzzy or evolving rapidly</td></tr><tr><td>Orchestrator-workers</td><td>A coordinator chooses and delegates subtasks</td><td>A simple fixed chain would be cheaper</td></tr><tr><td>Dynamic decomposition</td><td>Investigation where each discovery changes the plan</td><td>The task is mechanical and well-defined</td></tr><tr><td>Parallel subagents</td><td>Independent workstreams</td><td>Workstreams depend on each other&#x27;s results</td></tr></table>\n<p>Examples:</p>\n<ul><li>Use prompt chaining for a fixed three-stage review: style, security, documentation.</li><li>Use routing when invoices, receipts, and contracts require different extraction tools.</li><li>Use orchestrator-workers when a research coordinator decides which specialists to invoke.</li><li>Use dynamic decomposition for debugging an intermittent backend failure.</li><li>Use parallel subagents when several independent documents or repositories can be analyzed separately.</li></ul>\n<p>The decision is not &quot;which pattern is best&quot; but &quot;which pattern matches the shape of this work.&quot; Prompt chaining adds reliability by constraining the model to a known sequence; pay that cost when the steps really are fixed and skip it when the work is exploratory. Dynamic decomposition is appropriate when the next step genuinely depends on what the model just learned — for example, an investigation where the first finding determines whether to gather logs, query a database, or interview a stakeholder. Hard-coding investigation steps tends to either miss the actual problem or waste effort gathering irrelevant data.</p>\n<p>A useful contrast: a billing-dispute resolution workflow that always runs &quot;verify identity → fetch invoice → check policy → propose adjustment&quot; is a good fit for prompt chaining. A security incident triage that runs &quot;examine alert → decide whether to pull logs, query a SIEM, page on-call, or all three&quot; is a good fit for dynamic decomposition. Forcing chaining onto the second wastes coordinator effort and produces shallow analyses; forcing decomposition onto the first invites unnecessary tool calls and inconsistent outputs.</p>\n<p>Dynamic decomposition specifically suits investigations where the next move only becomes clear after the current finding. Debugging an intermittent backend failure, root-causing a customer&#x27;s unusual error report, or narrowing down a flaky test all share that shape: the model cannot write a fixed plan upfront because what to look at next depends on what the previous step revealed. A pre-written debugging checklist often misses the actual cause and runs every step regardless. With dynamic decomposition, the coordinator commits to a goal (find the cause), inspects what it has, and decides the next action — gather logs, examine config, reproduce locally, escalate — based on the current evidence. The trade-off is unpredictability: dynamic plans are harder to budget for than fixed chains, so set explicit termination criteria and step caps.</p>\n<h3>When the Coordinator Should Not Delegate</h3>\n<p>Subagents add overhead. Each delegation incurs a tool call, a fresh context, a separate model invocation, and a result-passing step. When the coordinator already has the relevant context and the work is small, calling a subagent is slower and more expensive than just doing the work in the coordinator&#x27;s turn. Save delegation for cases where the task would flood the coordinator&#x27;s context (a long document analysis), genuinely needs a different prompt or tool set (a specialist persona), or can run in parallel with other work. For &quot;summarize these three sentences I just retrieved,&quot; let the coordinator answer.</p>\n<h3>Parallel Subagents Across a Partition</h3>\n<p>When a single large task can be cut into independent pieces — auditing 50 repositories, analyzing 30 documents, scanning 100 dependencies — the right pattern is partition-then-parallel: the coordinator divides the input set into N roughly equal chunks, spawns N subagents (one per chunk), and synthesizes their structured outputs. Each subagent works only on its slice of the partition, returning a uniform result shape the coordinator can merge.</p>\n<p>This pattern wins when the work is uniform enough that the coordinator can describe each subagent&#x27;s job from a template and the units do not need to consult one another. Total elapsed time becomes max(subagent_durations), so balance partitions by expected effort rather than by raw count. If a few partitions are far heavier than the rest, the slowest one dictates total time and the parallelism is wasted.</p>\n<p>Avoid this pattern when units depend on each other&#x27;s findings (a finding from repo A must inform the analysis of repo B), when the partition would split a logical unit (chopping a document mid-section), or when sequential streaming output to the user matters more than total throughput.</p>\n<h3>Multi-Agent Context Passing</h3>\n<p>Subagents do not automatically share the parent&#x27;s conversation state. When the parent agent invokes a subagent (in the Claude Agent SDK, this typically happens through a Task or Agent tool), the subagent starts a fresh conversation. It receives only what the parent explicitly passes — usually the prompt the parent constructed, plus the subagent&#x27;s own definition (system prompt, allowed tools, model selection). It does not see the parent&#x27;s prior user turns, prior assistant turns, prior tool results, or memory of earlier subagent runs.</p>\n<p>Two consequences follow. First, every piece of context the subagent needs has to be in the prompt the parent constructs: the goal, the relevant findings, the constraints, the expected output shape, the source references. Second, a &quot;resume the previous research subagent&quot; pattern doesn&#x27;t exist by default — calling the Agent tool again starts a brand-new agent. If you need continuity, the parent must persist an identifier and pass it through, or include the prior summary in the new prompt.</p>\n<p>A coordinator must therefore pass the context each subagent needs. Usually that means a concise task, relevant findings, source references, constraints, and expected output shape.</p>\n<p>Poor handoff:</p>\n<pre><code>Synthesize the findings.</code></pre>\n<p>Better handoff:</p>\n<pre><code>Synthesize the following claim-source records into an executive summary. Preserve uncertainty, cite each claim with its source_id, and separate established findings from contested findings.</code></pre>\n<p>For final report generation, do not pass only a prose summary if citations are required. Pass a structured source index that maps claims to source IDs, URLs, excerpts, dates, and confidence/uncertainty notes.</p>\n<h3>Tool Distribution Across Agents</h3>\n<p>More tools are not always better. Giving every subagent every tool increases selection complexity and can lead agents outside their role. Restrict tools to what each subagent needs.</p>\n<p>Examples:</p>\n<ul><li>A web research subagent needs search and fetch tools.</li><li>A document analysis subagent needs document-read/extraction tools.</li><li>A synthesis subagent may need no external search tools if it should only work from supplied findings.</li><li>A report generator needs formatting and citation inputs, not raw broad search.</li></ul>\n<p>In the Claude Agent SDK, the mechanism for delegating to a subagent is itself a tool — typically named <code>Task</code> or <code>Agent</code>. For the parent to spawn a subagent, this tool must appear in the parent&#x27;s <code>allowedTools</code> list. Forgetting to allow the Task/Agent tool is a common reason an &quot;orchestrator&quot; cannot delegate at all: the subagent definitions exist, but the parent has no callable interface to launch them. The subagent&#x27;s own <code>allowedTools</code> is configured separately in the AgentDefinition and constrains what the subagent can do once spawned.</p>\n<h3>Parallel Execution</h3>\n<p>If tasks are independent, the coordinator should start them concurrently rather than serially. In tool-calling systems, that often means emitting multiple tool calls in one assistant turn when the platform supports parallel tool calls. In an external orchestrator, it may mean launching concurrent SDK calls and aggregating results.</p>\n<p>Do not parallelize when the second task needs the first task&#x27;s output. For example, document analysis cannot inspect sources until sources are identified, but analyzing independent source documents can run in parallel after retrieval.</p>\n<p>A common phasing pattern is: serial decomposition (one model call to plan and identify the independent units of work) followed by parallel execution (each unit runs as its own subagent or tool call concurrently) followed by serial synthesis (one final call assembles the results). The parallel phase wins the most latency back when subtasks involve I/O — fetches, searches, document analyses — because elapsed time becomes max(subtask_durations) instead of sum(subtask_durations). For CPU-bound or token-bound work the speedup is smaller. When subtasks have differing latency, the slowest determines total time, so balance work across subagents rather than letting one of them carry an outsized share.</p>\n<h3>State Persistence</h3>\n<p>Long-running multi-agent workflows need durable state. Persist structured exports, not only transcripts:</p>\n<pre><code>{\n  &quot;workflow_id&quot;: &quot;research_2026_04_30&quot;,\n  &quot;completed_steps&quot;: [&quot;source_search&quot;, &quot;source_screening&quot;],\n  &quot;documents&quot;: [\n    {\n      &quot;source_id&quot;: &quot;src_17&quot;,\n      &quot;status&quot;: &quot;analyzed&quot;,\n      &quot;claims&quot;: [&quot;claim_40&quot;, &quot;claim_41&quot;]\n    }\n  ],\n  &quot;open_gaps&quot;: [&quot;recent regulatory changes&quot;]\n}</code></pre>\n<p>On resume, the coordinator loads the manifest and injects only relevant state into each agent prompt. This is more efficient than replaying every subagent transcript.</p>\n<h3>Provenance, Time, and Uncertainty</h3>\n<p>Research agents must preserve provenance and dates. Without dates, a synthesis agent may treat older and newer statistics as contradictory when they actually show a trend. Without source mapping, claims lose citations. Without uncertainty structure, reports become either overconfident or over-hedged.</p>\n<p>Ask subagents to output:</p>\n<ul><li>Claim.</li><li>Source ID and location.</li><li>Publication or data collection date.</li><li>Methodology notes.</li><li>Confidence or uncertainty language from the source.</li><li>Whether the finding is established, contested, or insufficiently supported.</li></ul>\n<p>Render different content types appropriately. Financial metrics may belong in tables; qualitative developments may belong in prose; patent categories may belong in grouped lists.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Using a full pipeline for simple facts.</strong> Let the coordinator choose a smaller path for simple queries.</li><li><strong>Strict one-pass research.</strong> If analysis finds gaps, the coordinator should trigger targeted follow-up search.</li><li><strong>Passing raw 100K-token outputs between every agent.</strong> Pass structured summaries plus source indexes.</li><li><strong>Over-prescribing subagents.</strong> Give goals and quality criteria, not brittle step-by-step search strings, when adaptability matters.</li></ul>", "search": "8. Agentic Patterns and Task Decomposition ### What to Know\n\nAgentic applications run a loop: observe, reason, act, observe again. The model sees current context, chooses a tool or response, incorporates results, and continues until the task is done or blocked.\n\nThe architecture question is how much autonomy to give the model and how to structure the work.\n\n### Core Patterns\n\n| Pattern | Best For | Avoid When |\n|---|---|---|\n| Prompt chaining | Fixed workflows with known steps | The path depends heavily on findings |\n| Routing | Inputs fall into distinct handling categories | Categories are fuzzy or evolving rapidly |\n| Orchestrator-workers | A coordinator chooses and delegates subtasks | A simple fixed chain would be cheaper |\n| Dynamic decomposition | Investigation where each discovery changes the plan | The task is mechanical and well-defined |\n| Parallel subagents | Independent workstreams | Workstreams depend on each other's results |\n\nExamples:\n\n- Use prompt chaining for a fixed three-stage review: style, security, documentation.\n- Use routing when invoices, receipts, and contracts require different extraction tools.\n- Use orchestrator-workers when a research coordinator decides which specialists to invoke.\n- Use dynamic decomposition for debugging an intermittent backend failure.\n- Use parallel subagents when several independent documents or repositories can be analyzed separately.\n\nThe decision is not \"which pattern is best\" but \"which pattern matches the shape of this work.\" Prompt chaining adds reliability by constraining the model to a known sequence; pay that cost when the steps really are fixed and skip it when the work is exploratory. Dynamic decomposition is appropriate when the next step genuinely depends on what the model just learned — for example, an investigation where the first finding determines whether to gather logs, query a database, or interview a stakeholder. Hard-coding investigation steps tends to either miss the actual problem or waste effort gathering irrelevant data.\n\nA useful"}, {"id": "ch-10", "title": "Chapter 9 — Production workflows", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>9. Customer Service and Production Workflow Design</h2><h3>What to Know</h3>\n<p>Customer service agents combine tool use, policy, state, escalation, and user experience. The agent should resolve what it can, escalate when it should, and communicate uncertainty honestly.</p>\n<h3>Escalation</h3>\n<p>Escalate when:</p>\n<ul><li>The user explicitly asks for a human and the issue cannot be resolved immediately without overriding their preference.</li><li>The issue requires authority the agent does not have.</li><li>A policy exception, regulated approval, or high-value transaction is involved.</li><li>The agent cannot make meaningful progress.</li><li>Tool results show an uncertain or unsafe state that requires human judgment.</li></ul>\n<p>Do not rely on simplistic counters such as &quot;escalate after three failed tools.&quot; The category and impact of the failure matter more than the count.</p>\n<p>When escalating, pass a structured handoff:</p>\n<pre><code>{\n  &quot;customer_id&quot;: &quot;cust_193&quot;,\n  &quot;issue_type&quot;: &quot;billing_adjustment&quot;,\n  &quot;root_cause&quot;: &quot;subscription tier mismatch&quot;,\n  &quot;relevant_records&quot;: [&quot;invoice_8841&quot;, &quot;case_2209&quot;],\n  &quot;amount&quot;: 72.15,\n  &quot;actions_taken&quot;: [&quot;verified account&quot;, &quot;checked invoice&quot;],\n  &quot;recommended_next_action&quot;: &quot;manager approval for adjustment&quot;\n}</code></pre>\n<p>Do not pass only the user&#x27;s first complaint. Do not dump the full transcript unless the receiving system can use it.</p>\n<h3>Frustrated Users</h3>\n<p>When a user is frustrated, acknowledge the frustration and move efficiently. If the issue is straightforward and the user asks for a human, offer the immediate resolution while preserving their choice:</p>\n<pre><code>I can resolve this now, and I can also transfer you if you prefer. The eligible action is ready; would you like me to complete it or connect you to a specialist?</code></pre>\n<p>Do not silently perform account actions after a frustrated user asks for a person. Do not make them answer a long intake questionnaire if one targeted question is enough.</p>\n<h3>Compliance and Authorization</h3>\n<p>Hard rules must be enforced programmatically:</p>\n<ul><li>Refunds above a threshold.</li><li>Reimbursements requiring manager approval.</li><li>Regulated financial or healthcare workflows.</li><li>Destructive infrastructure operations.</li></ul>\n<p>Use tool-level enforcement, middleware, permissions, or hooks. Prompt instructions can guide behavior but are not tamper-proof.</p>\n<p>The safest design often puts the rule inside the tool itself. For example, <code>process_reimbursement</code> can internally disburse amounts below a threshold and create a pending manager approval above it. This prevents the model from bypassing the rule by choosing the wrong tool or setting an approval flag incorrectly.</p>\n<p>A few patterns work well in combination, and the exam tends to test the difference:</p>\n<ul><li><strong>Threshold enforcement inside the tool.</strong> The tool reads the threshold from a server-controlled source — feature flag, policy service, account record — not from a parameter the model passes. The model can call <code>issue_credit(amount=…)</code> but cannot raise the cap by setting <code>override=true</code>, because no such parameter exists on the public interface. If a model call exceeds the limit, the tool returns a structured &quot;requires_approval&quot; result, not a silent failure.</li><li><strong>Preview-then-execute with single-use tokens.</strong> For high-impact actions (closing accounts, charging cards, sending external notifications), split the operation into two tools: a preview tool that returns a redacted summary plus a one-time execution token, and an execute tool that consumes that token. The model presents the preview to the user verbatim, the user confirms, and only then does the execute tool fire. The token is short-lived and bound to the previewed payload; the model cannot construct a token from scratch or reuse one with different parameters.</li><li><strong>Server-side authorization checks before any state change.</strong> Even when the model is well-behaved, the tool should re-verify the caller&#x27;s authority on every invocation. &quot;The model already checked policy&quot; is not a defense. Tools live inside the trust boundary; they must validate.</li></ul>\n<p>Avoid letting prompt instructions (&quot;never refund above $50 without manager approval&quot;) be the only line of defense. Adversarial users, prompt-injection in retrieved content, or a malformed tool description can all push the model past prose rules. Defense-in-depth means: prompt rules to bias the agent, tool implementations to enforce, and audit logs to detect.</p>\n<h3>Graceful Degradation</h3>\n<p>If a tool fails mid-workflow, the agent should still deliver useful progress:</p>\n<ul><li>Explain what has been verified.</li><li>State what could not be completed.</li><li>Be transparent about system issues.</li><li>Offer next steps such as retry, escalation, or notification.</li></ul>\n<p>Do not claim a side effect will happen if the system has not completed it. Do not immediately escalate when the agent can still answer part of the user&#x27;s problem.</p>\n<p>For partial completion, prefer &quot;here is what is done, here is what is pending, here is how we can finish&quot; over either a flat success message or a generic &quot;we hit an error.&quot; Users tolerate visible incompleteness; they do not tolerate later discovering that an action they thought was completed had silently rolled back. When the same tool keeps failing on the same input, treat it as a signal to switch strategies — try a different tool, ask a clarifying question, or escalate — rather than burning more retries on the same call.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Escalating with no useful handoff.</strong> Human agents need context and recommendations.</li><li><strong>Processing high-risk actions based on prompt rules.</strong> Use code-level enforcement.</li><li><strong>Retrying uncertain writes.</strong> Avoid duplicate charges, messages, or postings.</li><li><strong>Over-automating user confirmation.</strong> Show concrete action details.</li></ul>", "search": "9. Customer Service and Production Workflow Design ### What to Know\n\nCustomer service agents combine tool use, policy, state, escalation, and user experience. The agent should resolve what it can, escalate when it should, and communicate uncertainty honestly.\n\n### Escalation\n\nEscalate when:\n\n- The user explicitly asks for a human and the issue cannot be resolved immediately without overriding their preference.\n- The issue requires authority the agent does not have.\n- A policy exception, regulated approval, or high-value transaction is involved.\n- The agent cannot make meaningful progress.\n- Tool results show an uncertain or unsafe state that requires human judgment.\n\nDo not rely on simplistic counters such as \"escalate after three failed tools.\" The category and impact of the failure matter more than the count.\n\nWhen escalating, pass a structured handoff:\n\n```json\n{\n  \"customer_id\": \"cust_193\",\n  \"issue_type\": \"billing_adjustment\",\n  \"root_cause\": \"subscription tier mismatch\",\n  \"relevant_records\": [\"invoice_8841\", \"case_2209\"],\n  \"amount\": 72.15,\n  \"actions_taken\": [\"verified account\", \"checked invoice\"],\n  \"recommended_next_action\": \"manager approval for adjustment\"\n}\n```\n\nDo not pass only the user's first complaint. Do not dump the full transcript unless the receiving system can use it.\n\n### Frustrated Users\n\nWhen a user is frustrated, acknowledge the frustration and move efficiently. If the issue is straightforward and the user asks for a human, offer the immediate resolution while preserving their choice:\n\n```text\nI can resolve this now, and I can also transfer you if you prefer. The eligible action is ready; would you like me to complete it or connect you to a specialist?\n```\n\nDo not silently perform account actions after a frustrated user asks for a person. Do not make them answer a long intake questionnaire if one targeted question is enough.\n\n### Compliance and Authorization\n\nHard rules must be enforced programmatically:\n\n- Refunds above a threshold.\n- Reimbursements requiring manager approval.\n- Regulated "}, {"id": "ch-11", "title": "Chapter 10 — Claude Code and Agent SDK", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>10. Claude Code and Claude Agent SDK Workflows</h2><h3>What to Know</h3>\n<p>Claude Code is an agentic coding tool. The Claude Agent SDK exposes the same style of agent loop, built-in tools, hooks, sessions, subagents, permissions, and MCP integrations for programmable agents.</p>\n<p>Current docs refer to the product library as the Claude Agent SDK. Older references may say Claude Code SDK.</p>\n<h3>Built-in Tool Selection</h3>\n<table><tr><th>Task</th><th>Best Tool</th></tr><tr><td>Search file contents</td><td>Grep</td></tr><tr><td>Find files by path/name pattern</td><td>Glob</td></tr><tr><td>Read a known file</td><td>Read</td></tr><tr><td>Targeted unique edit</td><td>Edit or MultiEdit</td></tr><tr><td>Full file replacement</td><td>Read then Write</td></tr><tr><td>Run tests or shell commands</td><td>Bash</td></tr><tr><td>Delegate broad exploration</td><td>Task/subagent</td></tr></table>\n<p>Use Grep for text inside files. Use Glob for filenames and paths. Do not use filename search to find code references inside files.</p>\n<p>For codebase exploration, start from entry points and follow imports/calls. Do not read hundreds of files upfront. Map first, then read selectively.</p>\n<p>Original exploration workflow:</p>\n<ol><li>Grep for route names, error codes, or function identifiers.</li><li>Read the matching entry files.</li><li>Follow imports to core abstractions.</li><li>Trace one or two representative execution paths.</li><li>Summarize findings in a scratchpad when the investigation is long.</li></ol>\n<p>When asking Claude Code to follow existing project patterns, provide concrete context rather than vague instructions. Use file references such as <code>@src/payments/repository.ts</code> or <code>@docs/testing.md</code> when those files are the examples the agent should imitate. Concrete examples beat generic requests like &quot;follow our usual style.&quot;</p>\n<h3>Plan Mode vs Direct Execution</h3>\n<p>Use direct execution for small, localized, low-risk changes where the target is clear.</p>\n<p>Use plan mode when:</p>\n<ul><li>The change spans many files.</li><li>There are architectural choices.</li><li>The work involves migrations or breaking changes.</li><li>You need stakeholder approval before edits.</li><li>You want read-only exploration before implementation.</li></ul>\n<p>Plan mode lets Claude read and propose a plan before touching disk. In Claude Code, <code>--permission-mode plan</code> starts in plan mode, and <code>Shift+Tab</code> can toggle modes in interactive sessions.</p>\n<p>For urgent production bugs, start by gathering evidence: stack trace, relevant code, logs, and reproduction path. If the fix is obvious and narrow, implement directly. If the root cause reveals broad architectural impact, switch to planning before a larger change.</p>\n<h3>Plan Mode vs Extended Thinking</h3>\n<p>These are different mechanisms and should not be conflated. Plan mode is a Claude Code session mode in which the assistant explores read-only and produces a plan before any edits, then waits for user approval. It is about <em>workflow control</em> — gating the transition from &quot;thinking&quot; to &quot;doing&quot; so the human can review the strategy.</p>\n<p>Extended thinking is a model capability where Claude is given more internal reasoning budget before producing its output. It is about <em>reasoning quality</em> on hard problems — multi-step proofs, intricate code analysis, ambiguous requirement reconciliation — and does not by itself change whether the model takes actions or asks for approval. On current models the reasoning budget is managed adaptively — the model decides when and how much to think, scaled by a request-level effort setting — rather than by a fixed token budget; the Model Selection and Inference Controls section covers the trade-offs.</p>\n<p>Both can be used together: plan mode for review-gate the workflow, extended thinking for harder reasoning during planning or implementation. But they solve different problems. If the issue is that the agent jumps straight to edits without surfacing trade-offs, use plan mode. If the issue is that the agent gives shallow analyses on a complex problem, use extended thinking.</p>\n<h3>Sessions</h3>\n<p>Claude Code organizes work into sessions — each session is a stored conversation transcript that can be resumed later. Several CLI flags control session behavior, and they are easy to confuse:</p>\n<table><tr><th>Flag</th><th>Behavior</th><th>Best Use</th></tr><tr><td><code>--continue</code></td><td>Resumes the most recent conversation in the current directory without prompting</td><td>Returning to the latest in-progress work in a project</td></tr><tr><td><code>--resume</code> (<code>-r</code>)</td><td>Resumes a specific saved session, opening a picker if no identifier is given</td><td>Selecting a specific historical session or an explicitly named session</td></tr><tr><td><code>--session-id &lt;UUID&gt;</code></td><td>Uses (or creates) a session with a specific UUID</td><td>Programmatic workflows that need a stable, known identifier</td></tr><tr><td><code>--fork-session</code></td><td>Creates a new session branched from an existing transcript</td><td>Exploring an alternative path without contaminating the original</td></tr></table>\n<p>Use a named or specific session when returning to a known investigation. Use <code>--continue</code> only when the most recent conversation is definitely the one you want — in a directory where you&#x27;ve worked on multiple unrelated tasks, &quot;the latest&quot; can be the wrong session.</p>\n<p><code>--fork-session</code> is the right tool when you want to evaluate two different approaches starting from the same prior state. The original session is preserved untouched; the fork is a separate transcript whose history is a copy of the original at the fork point. This is preferable to resuming the original twice and trying to keep two diverging conversations straight, and preferable to copying-and-pasting context into a fresh session, which loses tool-call history.</p>\n<p>If the codebase changed since the previous session:</p>\n<ul><li>Resume and tell Claude exactly which files or functions changed when most prior context remains useful.</li><li>Start fresh with a summary when the old transcript is likely stale or misleading.</li></ul>\n<p>Sessions persist conversation history, not filesystem state. If you need isolated file changes, use git branches or worktrees. For comparing two alternative implementations, fork the session so each approach can evolve independently <em>and</em> use a separate worktree so the file changes do not collide. Forking the session without isolating the files leaves both attempts editing the same checkout; isolating files without forking the session intermingles the conversation transcripts.</p>\n<p>Avoid resuming the same session in multiple terminals at once. Both processes can append to the same session history, making later resumes confusing.</p>\n<h3>Context Isolation and Self-Review</h3>\n<p>The same session that wrote code may be less critical of its own choices because its context includes the earlier reasoning. For high-stakes review, use a fresh review context, a dedicated review subagent, CI review, or a separate session with the diff and review criteria.</p>\n<h3>Scratchpads</h3>\n<p>For long codebase exploration, write a concise scratchpad of durable findings:</p>\n<ul><li>Important files.</li><li>Data flow.</li><li>Open questions.</li><li>Confirmed assumptions.</li><li>Risk areas.</li><li>Next steps.</li></ul>\n<p>This helps when context compacts or when another session must pick up the work.</p>\n<h3>CLAUDE.md and Memory</h3>\n<p>Claude Code has two complementary memory systems, both loaded into context at the start of every session:</p>\n<ul><li><strong>CLAUDE.md and rule files</strong> — instructions you write to give Claude persistent context: build commands, conventions, architecture notes, testing standards, workflow preferences.</li><li><strong>Auto memory</strong> — notes Claude maintains for itself, capturing build commands, debugging insights, and preferences it discovers from your corrections.</li></ul>\n<p>Both are loaded as <em>context</em>, not as enforced configuration. The model reads them and tries to follow them, but there is no compliance guarantee. For behavior that must apply regardless of what Claude decides — destructive Bash approval, blocked file paths, mandatory formatters — use hooks or <code>permissions.deny</code>. Memory shapes behavior; hooks enforce it.</p>\n<h4>CLAUDE.md hierarchy</h4>\n<p>CLAUDE.md files can live at several scopes. All discovered files are concatenated, with broader scopes loaded first and more-specific scopes loaded last so local instructions appear closest to the end of context:</p>\n<table><tr><th>Scope</th><th>Location</th><th>Purpose</th></tr><tr><td>Managed policy</td><td>OS-specific path (e.g. <code>/Library/Application Support/ClaudeCode/CLAUDE.md</code> on macOS)</td><td>Organization-wide rules deployed by IT; cannot be excluded</td></tr><tr><td>User</td><td><code>~/.claude/CLAUDE.md</code></td><td>Personal preferences across all projects</td></tr><tr><td>Project</td><td><code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code></td><td>Team-shared, committed to the repo</td></tr><tr><td>Local</td><td><code>./CLAUDE.local.md</code></td><td>Personal project-only preferences; gitignored</td></tr></table>\n<p><code>CLAUDE.md</code> (and <code>CLAUDE.local.md</code>) files in the working directory and any ancestor directory load fully at launch — Claude walks up the tree from where it was invoked and reads each one it finds. Files in <em>subdirectories</em> below the working directory load on demand when Claude reads files in those subtrees, so nested <code>CLAUDE.md</code> does not consume context until it is needed.</p>\n<p>Imports using <code>@path/to/file.md</code> syntax pull in additional content (relative or absolute paths, up to five hops deep). Imported files are expanded into context at launch, so imports help organization but do not save tokens.</p>\n<p>For large monorepos, the <code>claudeMdExcludes</code> setting skips ancestor <code>CLAUDE.md</code> files from other teams that aren&#x27;t relevant to your work. Managed policy <code>CLAUDE.md</code> cannot be excluded — it always applies.</p>\n<p>If a repository already has an <code>AGENTS.md</code> for other coding agents, create a <code>CLAUDE.md</code> that imports it (<code>@AGENTS.md</code>) or symlinks to it so both tools read the same instructions without duplication.</p>\n<h4>Claude rules for scoped instructions</h4>\n<p>For larger projects, keep <code>CLAUDE.md</code> focused on rules that should be present in every session and move topic- or area-specific instructions into the <code>.claude/rules/</code> directory. Each <code>.md</code> file there is treated as a rule; subdirectories are walked recursively.</p>\n<p>Rules can be scoped to specific file paths using YAML frontmatter with a <code>paths</code> glob list. The rule only enters context when Claude reads matching files:</p>\n<pre><code>---\npaths:\n  - &quot;src/api/**/*.ts&quot;\n  - &quot;tests/**/*.test.ts&quot;\n---\n\n# API Development Rules\n\n- All endpoints must include input validation.\n- Use the standard error response format.</code></pre>\n<p>A rule with no <code>paths</code> frontmatter loads unconditionally at the same priority as <code>.claude/CLAUDE.md</code>. With <code>paths</code>, it triggers only when Claude reads matching files. Personal rules can live in <code>~/.claude/rules/</code> and apply across every project on your machine; project rules take priority where they overlap.</p>\n<p>Use <code>.claude/rules/</code> instead of one large <code>CLAUDE.md</code> when instructions are large enough that loading them every session wastes context, when different areas of the codebase have meaningfully different conventions, or when multiple teams need to maintain their own area-specific rule files without conflicts. Use <code>CLAUDE.md</code> (not rules) for instructions that should genuinely be present in every session: project-wide conventions, build commands, the architecture summary every contributor needs.</p>\n<h4>Auto memory</h4>\n<p>Auto memory is a separate system Claude maintains for itself, stored per project at <code>~/.claude/projects/&lt;project&gt;/memory/</code>. Claude reads and writes files there during your session to record build commands, debugging insights, architecture notes, code-style preferences, and workflow habits it discovers.</p>\n<p>The directory holds a <code>MEMORY.md</code> entrypoint plus optional topic files (<code>debugging.md</code>, <code>api-conventions.md</code>, and so on). The first 200 lines or 25KB of <code>MEMORY.md</code> — whichever comes first — load at the start of every conversation. Topic files do not load at session start; Claude reads them on demand.</p>\n<p>Auto memory is machine-local. All worktrees and subdirectories within the same git repository share one auto memory directory, but auto memory does not sync across machines or cloud environments. It is on by default; toggle inside <code>/memory</code>, set <code>autoMemoryEnabled: false</code> in project settings, or set <code>CLAUDE_CODE_DISABLE_AUTO_MEMORY=1</code> to disable.</p>\n<h4>CLAUDE.md vs rules vs skills vs hooks</h4>\n<p>These four mechanisms shape Claude Code behavior, and exam scenarios often hinge on choosing the right one:</p>\n<table><tr><th>Mechanism</th><th>When loaded</th><th>What it does</th><th>Use for</th></tr><tr><td><code>CLAUDE.md</code></td><td>Every session</td><td>Soft guidance (context)</td><td>Project-wide rules, architecture, conventions needed every session</td></tr><tr><td><code>.claude/rules/</code></td><td>Every session, or only when matching paths are read</td><td>Soft guidance (context)</td><td>Topic- or area-specific instructions; scope via <code>paths:</code> globs</td></tr><tr><td>Skills</td><td>On demand</td><td>Soft guidance with a structured procedure</td><td>Multi-step workflows invoked intentionally or recognized from a description</td></tr><tr><td>Hooks</td><td>Lifecycle events (<code>PreToolUse</code>, <code>PostToolUse</code>, etc.)</td><td>Hard enforcement (commands in Claude Code; callback functions in the Agent SDK)</td><td>Allow/deny rules, formatters, mandatory approvals</td></tr></table>\n<p>The rule of thumb: if it is a fact Claude should know in every session, put it in <code>CLAUDE.md</code>. If it only matters in part of the codebase, put it in <code>.claude/rules/</code> with <code>paths:</code>. If it is a multi-step procedure invoked deliberately, it is a skill. If it must run deterministically regardless of what the model decides, it is a hook.</p>\n<h4>Inspecting and debugging memory</h4>\n<p>Use <code>/memory</code> to list every <code>CLAUDE.md</code>, <code>CLAUDE.local.md</code>, and rule file currently loaded, browse auto-memory contents, and open files for editing. This is the first diagnostic step when Claude inconsistently follows project conventions: confirm the expected file is loaded before adding more instructions. If a rule is in a file that isn&#x27;t being loaded for the current working directory, no amount of additional prompting will fix the behavior — the problem is the loading scope, not the wording.</p>\n<p>For deeper debugging — especially with path-scoped rules or nested <code>CLAUDE.md</code> files that load lazily — use the <code>InstructionsLoaded</code> hook, which logs exactly which instruction files load, when, and why.</p>\n<h4>Prefer scoped memory</h4>\n<p>Within memory itself, prefer the narrowest scope that captures the rule:</p>\n<ul><li>Repo-wide standards belong in project <code>CLAUDE.md</code> (<code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code>).</li><li>Area-specific conventions belong in subdirectory <code>CLAUDE.md</code>, or path-scoped rules in <code>.claude/rules/</code> with <code>paths:</code> globs.</li><li>Reused standards: <code>@imports</code> to share content across <code>CLAUDE.md</code> files (imports still consume context at launch).</li><li>Personal preferences: <code>~/.claude/CLAUDE.md</code>, <code>~/.claude/rules/</code>, or <code>CLAUDE.local.md</code> — not team-wide rules, which belong in repo-tracked files so all collaborators benefit.</li></ul>\n<p>Do not put every occasional workflow into global memory, and be precise about what kind of scoping you need. These are not interchangeable:</p>\n<ul><li><strong>Task-scoped</strong> (only relevant when the user is doing a particular activity — a code review, a release, a migration plan): use a slash command, skill, or specialized subagent. These mechanisms are invoked deliberately.</li><li><strong>Path- or area-scoped</strong> (only relevant when Claude reads files in a particular part of the codebase — API endpoints, tests, generated files): use path-scoped rules in <code>.claude/rules/</code> with <code>paths:</code> globs. These trigger from matching file reads, not from &quot;the user is doing X.&quot;</li></ul>\n<p>Picking the wrong scoping is a common mistake — a code-review checklist does not belong in <code>.claude/rules/</code> even if you can write a <code>paths:</code> glob that approximates &quot;files in review,&quot; because the rule will fire whenever Claude touches those files outside a review too. <code>CLAUDE.md</code> files are read every session, so bloating them with either kind of conditional content costs tokens and dilutes the parts that matter for ordinary work.</p>\n<h3>Skills</h3>\n<p>A skill packages task-specific instructions — and optionally supporting files — that Claude loads only when the task calls for it. Each skill is a folder containing a <code>SKILL.md</code> file with a short description plus the full procedure. The description is what stays in context by default; the body loads on demand when the model judges the skill relevant or the user invokes it. This progressive disclosure is the point: a 400-line release checklist costs a one-line description until a release is actually happening.</p>\n<p>How skills differ from the neighboring mechanisms:</p>\n<ul><li><strong><code>CLAUDE.md</code></strong> is always-on context for facts every session needs.</li><li><strong><code>.claude/rules/</code></strong> scopes context to file paths.</li><li><strong>Slash commands</strong> are user-invoked prompts; the human decides when they run.</li><li><strong>Skills</strong> sit in between: the user can invoke them, but Claude can also recognize from the description that a skill applies and load it itself.</li></ul>\n<p>Prefer a skill over a slash command when the workflow should trigger from the nature of the task (&quot;this is a database migration, load the migration procedure&quot;) rather than from an explicit human command. Prefer a slash command when invocation should remain a deliberate human act.</p>\n<h3>Slash Commands</h3>\n<p>Slash commands are reusable prompts. Use them for explicit workflows that developers invoke intentionally:</p>\n<ul><li><code>/review</code> for a review checklist.</li><li><code>/release-notes</code> for release note formatting.</li><li><code>/migration-plan</code> for a standard migration analysis.</li></ul>\n<p>Project commands are shared with the repo; user commands are personal. MCP prompts can also appear as slash commands.</p>\n<h3>Hooks and Permissions</h3>\n<p>Hooks run at lifecycle events. The most common ones to know are:</p>\n<ul><li><strong><code>PreToolUse</code></strong> — fires before a tool call. Can deny the call, allow it, ask the user for approval, defer (let normal permission rules decide), inject additional context the model will see, or modify the tool&#x27;s input. This is the correct class of mechanism for &quot;must always require approval&quot; policies.</li><li><strong><code>PostToolUse</code></strong> — fires after a tool call. Useful for logging, formatting, secondary checks, or appending follow-up context.</li><li><strong><code>UserPromptSubmit</code></strong> — fires when the user submits a prompt. Can block the submission, modify it, or attach extra context.</li><li><strong><code>SessionStart</code></strong> — fires once when a session begins. Useful for loading project context, setting up environment variables, or running pre-flight checks.</li></ul>\n<p>A <code>PreToolUse</code> hook is the canonical way to enforce hard rules in Claude Code: matching tool name and parameters against an allow/deny list, requiring confirmation for destructive shell commands, blocking edits to generated files, or refusing writes outside an approved directory. Because hooks run as code in your environment, they cannot be talked around by the model — that is exactly why they are the right place for hard rules.</p>\n<p>Examples:</p>\n<ul><li>Block destructive Bash patterns unless approved.</li><li>Prevent edits to generated files.</li><li>Run a formatter after successful edits.</li><li>Add environment context at session start.</li></ul>\n<p>Hooks execute as code in your environment — shell commands in Claude Code, callback functions in the Agent SDK. Treat them as code with security implications: a malicious or buggy hook can damage your system or exfiltrate data. Review hook configurations from third-party sources before enabling them, and avoid passing secrets through arguments that hooks may log.</p>\n<h3>Subagents</h3>\n<p>Subagents have separate context windows, focused prompts, and configurable tool access. Use them when a side task would flood the main context, when specialized behavior is reused, or when independent work can run in parallel.</p>\n<p>Good subagent design:</p>\n<ul><li>Clear single responsibility.</li><li>Specific description so Claude knows when to use it.</li><li>Limited tools needed for the role.</li><li>Output contract that the coordinator can consume.</li></ul>\n<p>Avoid making every subagent inherit every tool. Tool restriction improves focus and security.</p>\n<p>In Agent SDK and Claude Code configurations, delegation still requires the agent to have access to the tool or mechanism that launches subagents. If an agent describes a delegation but no subagent runs, check tool permissions and whether the subagent invocation tool is allowed.</p>\n<p>A subagent does not inherit the parent&#x27;s conversation. When the parent launches it, the subagent receives its AgentDefinition (its own system prompt, allowed tools, model selection) and the prompt string the parent constructed for that specific invocation. It does not see the parent&#x27;s earlier turns, prior tool results, or any other subagent&#x27;s output. This is intentional — it keeps subagent context focused — but it means the parent must restate every fact the subagent will need. Treat the prompt to a subagent like a brief to a contractor: assume nothing carries over.</p>\n<p>Two practical consequences:</p>\n<ul><li><strong>Don&#x27;t assume the subagent &quot;remembers&quot; your project.</strong> If the subagent needs the project&#x27;s coding conventions, paste or reference them in the prompt. CLAUDE.md will not always be loaded into the subagent&#x27;s context unless its definition does so.</li><li><strong>Don&#x27;t expect a &quot;second invocation&quot; of the same subagent to continue where the first left off.</strong> Each call is fresh. If state needs to persist across invocations, the parent persists it (in a file, in a structured note) and re-supplies the relevant slice with each call.</li></ul>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Using plan mode for tiny edits.</strong> It adds overhead.</li><li><strong>Using direct execution for broad migrations.</strong> You lose review and architecture planning.</li><li><strong>Assuming all session resumes are safe.</strong> Old context may reference changed code.</li><li><strong>Using a global <code>CLAUDE.md</code> for task-specific checklists.</strong> Use slash commands, skills, or path-scoped <code>.claude/rules/</code> files — they don&#x27;t bloat context on every session.</li><li><strong>Treating memory as enforcement.</strong> <code>CLAUDE.md</code> and rule files are context, not configuration. Hard rules belong in <code>PreToolUse</code> hooks or <code>permissions.deny</code>.</li><li><strong>Relying on prompt instructions for destructive Bash approval.</strong> Use hooks/permissions.</li></ul>", "search": "10. Claude Code and Claude Agent SDK Workflows ### What to Know\n\nClaude Code is an agentic coding tool. The Claude Agent SDK exposes the same style of agent loop, built-in tools, hooks, sessions, subagents, permissions, and MCP integrations for programmable agents.\n\nCurrent docs refer to the product library as the Claude Agent SDK. Older references may say Claude Code SDK.\n\n### Built-in Tool Selection\n\n| Task | Best Tool |\n|---|---|\n| Search file contents | Grep |\n| Find files by path/name pattern | Glob |\n| Read a known file | Read |\n| Targeted unique edit | Edit or MultiEdit |\n| Full file replacement | Read then Write |\n| Run tests or shell commands | Bash |\n| Delegate broad exploration | Task/subagent |\n\nUse Grep for text inside files. Use Glob for filenames and paths. Do not use filename search to find code references inside files.\n\nFor codebase exploration, start from entry points and follow imports/calls. Do not read hundreds of files upfront. Map first, then read selectively.\n\nOriginal exploration workflow:\n\n1. Grep for route names, error codes, or function identifiers.\n2. Read the matching entry files.\n3. Follow imports to core abstractions.\n4. Trace one or two representative execution paths.\n5. Summarize findings in a scratchpad when the investigation is long.\n\nWhen asking Claude Code to follow existing project patterns, provide concrete context rather than vague instructions. Use file references such as `@src/payments/repository.ts` or `@docs/testing.md` when those files are the examples the agent should imitate. Concrete examples beat generic requests like \"follow our usual style.\"\n\n### Plan Mode vs Direct Execution\n\nUse direct execution for small, localized, low-risk changes where the target is clear.\n\nUse plan mode when:\n\n- The change spans many files.\n- There are architectural choices.\n- The work involves migrations or breaking changes.\n- You need stakeholder approval before edits.\n- You want read-only exploration before implementation.\n\nPlan mode lets Claude read and propose a plan before touching"}, {"id": "ch-12", "title": "Chapter 11 — Iteration and evaluation", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>11. Iterative Refinement, Testing, and Evaluation</h2><h3>What to Know</h3>\n<p>Claude improves fastest when feedback is concrete and executable. Instead of &quot;handle edge cases better,&quot; provide failing inputs, expected outputs, test failures, validation errors, or code review examples.</p>\n<h3>Effective Iteration</h3>\n<p>For coding:</p>\n<ol><li>Define behavior with tests or examples.</li><li>Ask for the smallest useful implementation.</li><li>Run tests.</li><li>Feed back exact failures.</li><li>Iterate one failure class at a time.</li></ol>\n<p>For uncertain requirements, ask Claude to interview the user or surface decisions before implementation. This is especially useful for caching, real-time architecture, auth changes, or data consistency requirements.</p>\n<p>For formatting defects, fix one visible class at a time and verify. Avoid broad rewrites that introduce new regressions.</p>\n<p>The most effective feedback is concrete enough that the model can locate the failure: a specific failing input, the expected output, the actual output, the validation error, or the failing test name with its assertion message. &quot;It&#x27;s not handling edge cases&quot; gives the model nothing to act on; &quot;for input X, the expected key <code>service_visits</code> is missing because the source uses &#x27;maintenance entries&#x27; instead of &#x27;service visits&#x27;&quot; lets the model fix exactly that. When iterating on extraction or generation tasks, pair each failure with the specific source excerpt that triggered it and the rule that was violated.</p>\n<p>When the same defect keeps recurring across several runs of the same prompt, treat that as a signal that the prompt or schema needs a structural change — adding a few-shot example, splitting a tool into more specific tools, or surfacing a new field — rather than a sign that the model needs another retry. Prompt-level fixes generalize; per-instance retries do not.</p>\n<h3>Test Generation Quality</h3>\n<p>Generated tests are low value when they:</p>\n<ul><li>Only assert that code does not throw.</li><li>Duplicate existing coverage.</li><li>Ignore project fixtures.</li><li>Test implementation details rather than behavior.</li><li>Miss important branches and error paths.</li></ul>\n<p>Document test standards in project memory or a testing guide. Include examples of valuable behavioral tests versus trivial tests. Provide fixture names and intended use.</p>\n<h3>Code Review Agents</h3>\n<p>A useful review agent needs explicit report criteria. Tell it which findings matter: bugs, security, correctness, data loss, missing tests, incompatible API changes. Tell it what to skip: minor style preferences, local conventions already accepted, speculative performance advice.</p>\n<p>For false positive reduction, few-shot examples are more effective than vague &quot;be conservative&quot; instructions. Show acceptable code patterns next to genuinely problematic ones.</p>\n<p>If developers dismiss findings, capture why. Add fields such as <code>detected_pattern</code>, <code>rule_id</code>, or <code>evidence</code> so you can analyze what the system is over-reporting.</p>\n<h3>Evaluation Loops</h3>\n<p>Evaluate by segment:</p>\n<ul><li>Document type.</li><li>Field.</li><li>Prompt version.</li><li>Model.</li><li>Source quality.</li><li>Confidence band.</li><li>Reviewer correction category.</li></ul>\n<p>Aggregate accuracy can be misleading. A pipeline that is 97% accurate overall may fail on a specific high-impact field or document type.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Asking for a full rewrite after a narrow failure.</strong> Give the failing test and ask for a targeted fix.</li><li><strong>Using confidence without calibration.</strong> Measure it against labeled data.</li><li><strong>Treating reviewer dismissals as noise.</strong> They are feedback.</li><li><strong>Adding infrastructure before improving examples and criteria.</strong> Prompt/schema changes often solve repeated patterns.</li></ul>", "search": "11. Iterative Refinement, Testing, and Evaluation ### What to Know\n\nClaude improves fastest when feedback is concrete and executable. Instead of \"handle edge cases better,\" provide failing inputs, expected outputs, test failures, validation errors, or code review examples.\n\n### Effective Iteration\n\nFor coding:\n\n1. Define behavior with tests or examples.\n2. Ask for the smallest useful implementation.\n3. Run tests.\n4. Feed back exact failures.\n5. Iterate one failure class at a time.\n\nFor uncertain requirements, ask Claude to interview the user or surface decisions before implementation. This is especially useful for caching, real-time architecture, auth changes, or data consistency requirements.\n\nFor formatting defects, fix one visible class at a time and verify. Avoid broad rewrites that introduce new regressions.\n\nThe most effective feedback is concrete enough that the model can locate the failure: a specific failing input, the expected output, the actual output, the validation error, or the failing test name with its assertion message. \"It's not handling edge cases\" gives the model nothing to act on; \"for input X, the expected key `service_visits` is missing because the source uses 'maintenance entries' instead of 'service visits'\" lets the model fix exactly that. When iterating on extraction or generation tasks, pair each failure with the specific source excerpt that triggered it and the rule that was violated.\n\nWhen the same defect keeps recurring across several runs of the same prompt, treat that as a signal that the prompt or schema needs a structural change — adding a few-shot example, splitting a tool into more specific tools, or surfacing a new field — rather than a sign that the model needs another retry. Prompt-level fixes generalize; per-instance retries do not.\n\n### Test Generation Quality\n\nGenerated tests are low value when they:\n\n- Only assert that code does not throw.\n- Duplicate existing coverage.\n- Ignore project fixtures.\n- Test implementation details rather than behavior.\n- Miss important branche"}, {"id": "ch-13", "title": "Chapter 12 — Model selection", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>12. Model Selection and Inference Controls</h2><h3>What to Know</h3>\n<p>Claude is a family of models on a capability/cost/latency spectrum, and several request-level controls — thinking effort, streaming, output limits — change how a given model spends tokens and time. Architecture questions in this area are allocation questions: which tier does each part of the workload actually need, and which controls keep cost and latency proportional to task difficulty?</p>\n<p>The tiers, by family name:</p>\n<table><tr><th>Tier</th><th>Profile</th><th>Typical Architecture Role</th></tr><tr><td>Haiku</td><td>Fastest, cheapest</td><td>Classification, routing, simple extraction, high-volume low-complexity steps</td></tr><tr><td>Sonnet</td><td>Balanced intelligence and speed</td><td>Default production workhorse for most agents and pipelines</td></tr><tr><td>Opus</td><td>Most capable, highest cost</td><td>Complex agentic work, long-horizon planning, hard analysis and synthesis</td></tr></table>\n<p>Exact model versions, context windows, output limits, and prices change over time — and the lineup evolves, with newer top-end families periodically appearing above Opus. Consult the current models documentation (or query the Models API at runtime) rather than memorizing numbers. The architecture patterns are stable:</p>\n<ul><li><strong>Match the tier to the step, not to the product.</strong> Pipelines are heterogeneous. A support automation might use a small model to classify intent, a mid-tier model to run the conversation, and reserve the top tier for escalated analysis. Paying top-tier prices for &quot;classify this as positive or negative&quot; is the model-selection equivalent of running a batch job against a real-time SLA.</li><li><strong>Route cheap-to-expensive.</strong> A fast, cheap classifier in front of the pipeline can send most traffic to inexpensive handling and only the hard cases to a capable model. At volume, the router&#x27;s cost is recovered many times over.</li><li><strong>Mix tiers across agents.</strong> A coordinator on a capable model can delegate scoped subtasks — exploring files, summarizing one document, checking one repository — to subagents on cheaper models. Because the subtask prompt is focused, the capability gap matters less than it would on the open-ended task.</li><li><strong>Escalate on signal, not by default.</strong> Try the cheaper model and escalate on a measurable trigger: low calibrated confidence, failed validation, or an explicit &quot;needs deeper analysis&quot; classification. The inverse — defaulting everything to the largest model &quot;to be safe&quot; — is a budget decision dressed up as a safety decision.</li><li><strong>Validate tier changes with evals, not vibes.</strong> Run the candidate model against a labeled evaluation set, segmented the same way as extraction evals (document type, field, difficulty band), before switching a production stage.</li></ul>\n<h3>Thinking and Effort</h3>\n<p>Claude can spend internal reasoning tokens before answering. On current models this is <em>adaptive</em>: the model decides when and how much to think, and a request-level effort setting with graded levels scales how much total work — reasoning, tool use, and output — it puts into the task. Older models exposed extended thinking as a manually configured token budget; that control is deprecated on current models in favor of adaptive thinking, so treat fixed thinking budgets as a legacy detail.</p>\n<p>Architecture implications:</p>\n<ul><li>Reasoning depth is a cost and latency dial, not a binary. Higher effort means deeper reasoning, more thorough tool use, and more output tokens; lower effort means faster, terser, cheaper responses.</li><li>Spend reasoning where the task is reasoning-shaped: planning a migration, reconciling ambiguous requirements, debugging from indirect evidence. Mechanical extraction and classification rarely benefit — buy accuracy there with schemas and few-shot examples instead.</li><li>Effort is a per-request control. The same agent can run routine turns at moderate effort and raise it for a step flagged as hard. It is another allocation lever alongside model tier, caching, and batching.</li></ul>\n<h3>Streaming</h3>\n<p>Streaming returns the response incrementally as server-sent events instead of one final payload. Use it when:</p>\n<ul><li><strong>A human is watching.</strong> Time-to-first-token dominates perceived latency; a streamed response feels fast even when total generation time is unchanged.</li><li><strong>Outputs are long.</strong> Long generations over a single blocking HTTP request risk client and intermediary timeouts. Streaming keeps the connection moving and is required in practice for very large outputs.</li></ul>\n<p>Skip it when nothing consumes partial output: batch jobs, short machine-to-machine calls, and pipeline steps that only act on the complete result. Streaming changes delivery, not quality or token cost.</p>\n<h3>Stop Reasons</h3>\n<p>Every response reports why generation stopped. Production code should branch on this field rather than assuming the response is complete:</p>\n<table><tr><th><code>stop_reason</code></th><th>Meaning</th><th>Correct Handling</th></tr><tr><td><code>end_turn</code></td><td>Model finished naturally</td><td>Use the response</td></tr><tr><td><code>tool_use</code></td><td>Model is requesting tool calls</td><td>Execute the tools, return results, continue the loop</td></tr><tr><td><code>max_tokens</code></td><td>Output hit the requested cap</td><td>Treat the output as truncated; raise the cap, stream, or split the task</td></tr><tr><td><code>stop_sequence</code></td><td>A configured stop sequence fired</td><td>Expected when you configured one</td></tr><tr><td><code>pause_turn</code></td><td>A long-running server-side operation paused the turn</td><td>Re-send the conversation as-is so it resumes</td></tr><tr><td><code>refusal</code></td><td>The model declined for safety reasons</td><td>Surface to the user or route to review; do not blind-retry the same prompt</td></tr><tr><td><code>model_context_window_exceeded</code></td><td>The conversation no longer fits the context window</td><td>Compact, trim, or summarize — retrying the same request cannot succeed</td></tr></table>\n<p>The <code>max_tokens</code> and <code>model_context_window_exceeded</code> cases look similar — both produce incomplete work — but have different fixes: one is an output budget you set, the other is input exceeding the model&#x27;s window. Logging which one occurred prevents fixing the wrong limit.</p>\n<h3>API-Level Errors and Rate Limits</h3>\n<p>Tool-level error design (the Error Handling section) governs what the model sees. A separate error layer sits between your application and the API itself:</p>\n<ul><li><strong>429 rate limit.</strong> You exceeded request-per-minute or token-per-minute limits. Honor the <code>retry-after</code> header, apply exponential backoff with jitter, and smooth bursts client-side. The official SDKs already retry rate-limit and transient server errors automatically with backoff; add custom logic only for behavior beyond that.</li><li><strong>500 / 529 overloaded.</strong> Transient service-side conditions; retry with backoff.</li><li><strong>400 invalid request.</strong> A malformed request will not succeed on retry. Fix the request instead.</li></ul>\n<p>Sustained 429s are a capacity-planning signal, not an error-handling bug: spread load over time, move deferrable volume to the Batch API, request higher limits, or split workloads across models with separate limit pools. Rate limits are typically enforced per model and measured in both requests and input/output tokens per minute, so a token-heavy workload can be throttled long before its request count looks high.</p>\n<h3>Token Counting</h3>\n<p>The API provides a token-counting endpoint that returns the exact input token count for a prospective request — model-specific and free to call. Use it to budget long-document workloads, decide when chunking is needed, and estimate cost before submitting large batches. Do not estimate Claude token counts with third-party tokenizers built for other providers; they are calibrated to different vocabularies and miscount, especially on code and non-English text.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>One model for everything.</strong> Tier allocation per pipeline step is a primary cost lever, ahead of micro-optimizing prompts.</li><li><strong>Escalating by anxiety instead of signal.</strong> Define measurable triggers for when the expensive model is warranted.</li><li><strong>Treating truncation as a model failure.</strong> Check <code>stop_reason</code> — <code>max_tokens</code> is a configuration issue.</li><li><strong>Retrying refusals and context-window overflows unchanged.</strong> Neither can succeed without changing the request.</li><li><strong>Hand-rolling retry loops the SDK already provides.</strong> Configure the SDK&#x27;s retries; reserve custom logic for idempotency-sensitive flows.</li></ul>", "search": "12. Model Selection and Inference Controls ### What to Know\n\nClaude is a family of models on a capability/cost/latency spectrum, and several request-level controls — thinking effort, streaming, output limits — change how a given model spends tokens and time. Architecture questions in this area are allocation questions: which tier does each part of the workload actually need, and which controls keep cost and latency proportional to task difficulty?\n\nThe tiers, by family name:\n\n| Tier | Profile | Typical Architecture Role |\n|---|---|---|\n| Haiku | Fastest, cheapest | Classification, routing, simple extraction, high-volume low-complexity steps |\n| Sonnet | Balanced intelligence and speed | Default production workhorse for most agents and pipelines |\n| Opus | Most capable, highest cost | Complex agentic work, long-horizon planning, hard analysis and synthesis |\n\nExact model versions, context windows, output limits, and prices change over time — and the lineup evolves, with newer top-end families periodically appearing above Opus. Consult the current models documentation (or query the Models API at runtime) rather than memorizing numbers. The architecture patterns are stable:\n\n- **Match the tier to the step, not to the product.** Pipelines are heterogeneous. A support automation might use a small model to classify intent, a mid-tier model to run the conversation, and reserve the top tier for escalated analysis. Paying top-tier prices for \"classify this as positive or negative\" is the model-selection equivalent of running a batch job against a real-time SLA.\n- **Route cheap-to-expensive.** A fast, cheap classifier in front of the pipeline can send most traffic to inexpensive handling and only the hard cases to a capable model. At volume, the router's cost is recovered many times over.\n- **Mix tiers across agents.** A coordinator on a capable model can delegate scoped subtasks — exploring files, summarizing one document, checking one repository — to subagents on cheaper models. Because the subtask prompt is focused"}, {"id": "ch-14", "title": "Chapter 13 — Prompt caching", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>13. Prompt Caching</h2><h3>What to Know</h3>\n<p>Prompt caching lets the API reuse the processed form of a request prefix across calls. Cached tokens are dramatically cheaper to read than to process fresh — roughly an order of magnitude — while cache writes carry a modest premium over normal input. For any workload that re-sends the same large prefix — a system prompt, a tool catalog, a shared document, an ever-growing conversation — caching is one of the largest cost and latency levers available, often ahead of model choice and prompt trimming.</p>\n<p>One invariant governs everything: <strong>caching is an exact prefix match.</strong> The cache key is the rendered request up to a cache breakpoint, in render order: tools, then system prompt, then messages. A single changed byte anywhere in that prefix invalidates everything after it. Most caching failures are not missing markers; they are unstable prefixes.</p>\n<h3>Designing for Cache Stability</h3>\n<p>Order content by stability, most stable first:</p>\n<ol><li>Tool definitions — rendered first; keep them deterministic (stable ordering, no per-request variation).</li><li>System prompt — keep it frozen. Do not interpolate timestamps, session IDs, user names, or &quot;current state&quot; into it.</li><li>Stable conversation history.</li><li>Volatile per-request content — the latest user turn, injected state, retrieved documents that change per request — after the last breakpoint.</li></ol>\n<p>Common silent invalidators to audit for:</p>\n<ul><li>A timestamp or &quot;current date&quot; interpolated into the system prompt: every request becomes a unique prefix.</li><li>Non-deterministic serialization: JSON dumped without sorted keys, or a tool list built from an unordered collection.</li><li>Per-user or per-session IDs early in the prompt: no sharing across users, and sometimes none across requests.</li><li>Conditional system prompt sections toggled by feature flags: every flag combination is a separate cache entry.</li><li>Changing the tool set or the model mid-conversation: tools render at position zero, and caches are model-scoped, so either change invalidates everything.</li></ul>\n<p>This is where caching interacts with earlier sections. Upda
