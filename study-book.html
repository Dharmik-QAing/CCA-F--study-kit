rt parser must return:</p>\n<pre><code>{\n  &quot;site_name&quot;: &quot;string&quot;,\n  &quot;reported_by&quot;: &quot;string|null&quot;,\n  &quot;observed_issues&quot;: [&quot;string&quot;],\n  &quot;service_visits&quot;: [\n    {\n      &quot;technician&quot;: &quot;string&quot;,\n      &quot;work_performed&quot;: &quot;string&quot;,\n      &quot;visit_date&quot;: &quot;YYYY-MM-DD|null&quot;\n    }\n  ]\n}</code></pre>\n<p>The reliable design is not &quot;Respond only with valid JSON.&quot; Define an <code>extract_maintenance_report</code> tool with that schema, force that tool, and validate the resulting input object. If validation fails because a date is malformed, feed back the exact validation error rather than retrying blindly.</p>", "search": "1. API Fundamentals and Output Control ### What to Know\n\nClaude's Messages API is stateless. Claude does not remember previous API calls unless your application includes the relevant content in the next request. A production chat application must store the conversation and send the full current context on each turn: the system prompt, the selected prior messages, current application state, retrieved documents, and any tool results the model needs.\n\nThere is no magic memory flag that makes Claude remember earlier turns. A `session_id` in your own product, database, or orchestration layer can help you find stored history, but the model only sees what the request contains. If an assistant forgets facts from two turns ago in a short conversation, the most likely cause is that the application is not sending those prior messages.\n\nAs conversations grow, two things happen:\n\n- Input token cost and latency increase because more context is sent every turn.\n- The model has more competing information to attend to, including older user preferences, stale tool results, verbose RAG results, and its own earlier responses.\n\nThe Messages API uses a top-level `system` parameter for system prompts, not a `\"system\"` role inside `messages`. User and assistant turns go in `messages`. Tool use is represented with content blocks: assistant messages can contain `tool_use` blocks, and user messages can contain `tool_result` blocks.\n\n### Structured Outputs and Tool Use as Output Control\n\nClaude has two related ways to get machine-readable output:\n\n- **JSON structured outputs** use `output_config.format` with a JSON Schema. Claude's direct text response is constrained to valid JSON matching that schema.\n- **Tool use / strict tool use** constrains tool calls. You can define a tool with an input schema and read the model's `tool_use.input` as structured data, or use `strict: true` where supported to enforce tool-parameter schema compliance.\n\nUse JSON structured outputs when the final assistant response itself should be JSON. Use tool "}, {"id": "ch-3", "title": "Chapter 2 — Tool interfaces", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>2. Designing Tool Interfaces for LLM Agents</h2><h3>What to Know</h3>\n<p>An agent selects tools from their names, descriptions, parameter schemas, and examples. Tool design is prompt design plus API design. A good tool interface makes the right action easy and the wrong action difficult or impossible.</p>\n<p>Good tool descriptions explain:</p>\n<ul><li>What the tool does.</li><li>When to use it.</li><li>When not to use it.</li><li>Required input formats.</li><li>What the output contains.</li><li>Important limitations and safety concerns.</li></ul>\n<p>For complex tools, include <code>input_examples</code> when supported. Examples are especially helpful for nested objects, date formats, identifiers, and domain-specific enums.</p>\n<h3>Where Tools Run: Client, Server, and Protocol</h3>\n<p>&quot;Tool&quot; covers several execution models, and the architecture differs by who defines the interface and who runs the code:</p>\n<table><tr><th>Tool Type</th><th>Who Defines the Schema</th><th>Who Executes</th><th>Examples</th></tr><tr><td>User-defined (client-side)</td><td>You</td><td>Your application</td><td><code>search_orders</code>, <code>issue_store_credit</code></td></tr><tr><td>Anthropic-defined (client-side)</td><td>Anthropic</td><td>Your application</td><td>Bash, text editor, computer use, memory</td></tr><tr><td>Server-side</td><td>Anthropic</td><td>Anthropic&#x27;s infrastructure</td><td>Web search, web fetch, code execution</td></tr><tr><td>MCP</td><td>The MCP server</td><td>The MCP server</td><td>Connected third-party or internal servers</td></tr></table>\n<p>The placement determines the trust boundary and the operational burden:</p>\n<ul><li>Client-side tools execute inside your environment. You get full control — gating, logging, validation, custom UI — and full responsibility for sandboxing and abuse prevention.</li><li>Server-side tools require no execution infrastructure on your side: declare them in the request and the platform runs them, for example executing generated code in a managed sandbox or performing a web search. You give up the ability to intercept individual calls, so they suit self-contained capabilities rather than actions that must pass through your own approval or audit path.</li><li>MCP tools execute wherever the server runs, which is why server trust matters (see the MCP section).</li></ul>\n<p>A useful design heuristic for client-side work: a general tool like Bash gives the model broad leverage but gives your application only an opaque command string to inspect. Promote an action to a dedicated tool when the application needs to gate it behind confirmation, render it specially, audit it, or safely parallelize it — a <code>send_email</code> tool can be intercepted and confirmed; <code>bash -c &quot;curl -X POST ...&quot;</code> cannot.</p>\n<h3>Parameter Design</h3>\n<p>Prefer parameters that match the operation&#x27;s real domain model. Do not ask the model to reconstruct business invariants from a bag of strings.</p>\n<p>Use enums for stable, closed sets:</p>\n<pre><code>{\n  &quot;source&quot;: {\n    &quot;type&quot;: &quot;string&quot;,\n    &quot;enum&quot;: [&quot;knowledge_base&quot;, &quot;billing_records&quot;, &quot;support_tickets&quot;],\n    &quot;description&quot;: &quot;Which repository to search.&quot;\n  }\n}</code></pre>\n<p>Use lookup-then-act when users refer to entities by ambiguous names:</p>\n<ol><li><code>search_projects(query)</code> returns project IDs and distinguishing metadata.</li><li><code>archive_project(project_id)</code> acts only on an unambiguous ID.</li></ol>\n<p>When the lookup returns multiple candidates and the agent cannot confidently pick one, prefer presenting the candidates to the user with differentiating fields (creation date, owner, last activity, location) so the user can confirm which one is meant. A &quot;single-click&quot; UI selection — the user sees three candidates, picks one, and the agent proceeds with the chosen ID — is far more reliable than asking the model to guess and run a destructive operation. This pattern is complementary to preview-then-execute: disambiguation resolves <em>which entity</em> the user means, preview-then-execute confirms <em>what action</em> will happen to it.</p>\n<p>Prefer stable identifiers over derived intermediate values. If the user already has a <code>device_id</code>, a downstream tool should usually accept <code>device_id</code> rather than requiring the agent to call a previous tool just to extract a serial number or location. Let the tool resolve mechanical dependencies internally when model judgment is not needed.</p>\n<p>Split tools when parameters have interdependent constraints. If a workout can be cardio or strength, a single <code>log_workout(type, value, unit)</code> tool invites invalid combinations. Separate <code>log_cardio_session</code> and <code>log_strength_session</code> tools make the schema itself encode the distinction.</p>\n<p>When one operation type has different required fields from another, use separate tools. A unified <code>manage_order(action, ...)</code> tool causes omitted parameters and irrelevant fields. Separate <code>issue_store_credit</code>, <code>cancel_subscription</code>, and <code>replace_damaged_item</code> tools give Claude a simpler choice and a cleaner schema.</p>\n<h3>Output Design</h3>\n<p>Tool results should be structured, compact, and useful for the next decision. Include identifiers that downstream tools can use.</p>\n<p>Weak output:</p>\n<pre><code>Found these documents: Maintenance Schedule, Lab Access Plan, Vendor Notes.</code></pre>\n<p>Better output:</p>\n<pre><code>{\n  &quot;results&quot;: [\n    {\n      &quot;document_id&quot;: &quot;doc_284&quot;,\n      &quot;title&quot;: &quot;Maintenance Schedule&quot;,\n      &quot;owner&quot;: &quot;operations&quot;,\n      &quot;updated_at&quot;: &quot;2026-04-20&quot;\n    }\n  ],\n  &quot;total_matches&quot;: 1\n}</code></pre>\n<p>Normalize heterogeneous backend data before returning it to the agent. If three carriers represent shipment status differently, the tool should return a consistent schema such as <code>status</code>, <code>estimated_delivery</code>, <code>delay_reason</code>, and <code>requires_action</code>. Do not force the model to learn carrier-specific code mappings from raw payloads.</p>\n<p>Distinguish a successful empty result from an error. &quot;No matches found&quot; should be a successful result with an empty <code>results</code> array, not an <code>isError</code> tool result. Otherwise the agent may retry a valid query as though the tool failed.</p>\n<p>For paginated APIs, do not automatically fetch hundreds of items if the user may only need the first page. Return the first page, <code>total_count</code>, and a cursor or continuation token. Fetch more only if needed.</p>\n<h3>Tool Composition</h3>\n<p>Combine operations only when doing so preserves the model&#x27;s required judgment.</p>\n<p>Good candidates for composition:</p>\n<ul><li>Mechanical sequences where no decision is needed between steps.</li><li>Latency-heavy repeated lookups that always happen together.</li><li>Atomic operations where separate calls create race conditions (for example, &quot;check availability and book&quot; must be atomic when other users may grab the slot between two separate calls).</li></ul>\n<p>Keep steps separate when the model must inspect intermediate results before deciding. Selection, judgment, and editorial choice belong outside composite tools.</p>\n<p>Original examples:</p>\n<ul><li>A news-curation agent can use a composite <code>discover_and_score_articles(topic)</code> tool that returns candidates plus relevance scores, while leaving <code>add_article_to_collection(article_id)</code> separate because editorial selection requires judgment.</li><li>A booking system should combine &quot;check availability&quot; and &quot;reserve slot&quot; into one atomic <code>find_and_book_appointment</code> operation when separate calls risk another user taking the slot between calls. Adding a <code>hold_slot</code> tool can work but introduces a new race window and an extra step.</li><li>A research workflow should not combine &quot;retrieve sources&quot; and &quot;write final conclusion&quot; because the model needs to inspect the sources and preserve provenance.</li></ul>\n<p>When a downstream tool keeps requiring an upstream tool&#x27;s output for a mechanical reason (for example, fetching the address of a property just to pass it to a neighborhood-info tool), redesign the downstream tool to accept the stable identifier directly and resolve the address internally. This eliminates the latency of an unnecessary lookup and the failure coupling when the upstream call fails.</p>\n<h3>Pagination</h3>\n<p>External APIs often return paginated results. Auto-fetching every page is rarely the right behavior:</p>\n<ul><li>It causes long latency for queries that match many results.</li><li>It wastes tokens when the user only needs the first few items.</li><li>It can blow context when matches are very large.</li></ul>\n<p>Better design: return the first page, a <code>total_count</code> (or estimate), and a cursor or continuation token. Let the agent or user request more pages only when necessary.</p>\n<h3>Large Tool Sets and Progressive Availability</h3>\n<p>Tool selection degrades when the model must choose among too many similar tools. Empirically, accuracy drops noticeably as the tool count grows past a handful of similar options. If an agent has dozens of external connectors, API operations, or domain-specific tools, do not expose everything at once by default.</p>\n<p>Use progressive availability:</p>\n<ol><li>Start with a small set of discovery tools, such as <code>search_available_connectors</code> or <code>find_relevant_operations</code>.</li><li>Return a ranked shortlist with names, descriptions, required inputs, and confidence.</li><li>Dynamically add the selected matching tools to the agent&#x27;s available tools so it can call them on subsequent turns. Once discovered, the relevant tools persist and the agent uses them like any other tool.</li></ol>\n<p>This is different from a monolithic <code>find_and_execute</code> tool. Search-and-execute hides the final decision and can perform the wrong action too early. A discovery tool should narrow the choices; the agent or user should still be able to inspect the selected operation before execution when risk is meaningful.</p>\n<p>The Claude Agent SDK supports this pattern natively through tool search and dynamic tool registration. MCP servers can also notify clients when their tool list changes, allowing connected agents to refresh their view of available tools without reconnecting.</p>\n<h3>Output: requires_review and Decision Hints</h3>\n<p>When tool outputs include uncertainty (for example, ML extractions with confidence scores), do not just return raw confidence and ask the model to interpret it. Calibrate thresholds against a labeled validation set and return both the data and a derived <code>requires_review</code> boolean with reasons:</p>\n<pre><code>{\n  &quot;fields&quot;: {\n    &quot;vendor&quot;: {&quot;value&quot;: &quot;Acme Corp&quot;, &quot;confidence&quot;: 0.94},\n    &quot;amount&quot;: {&quot;value&quot;: 1280.5, &quot;confidence&quot;: 0.62}\n  },\n  &quot;requires_review&quot;: true,\n  &quot;review_reasons&quot;: [&quot;amount_below_confidence_threshold&quot;]\n}</code></pre>\n<p>Raw scores invite both over-trust and over-escalation. Calibrated thresholds produce consistent agent behavior.</p>\n<p>For confirmation flows, the tool should also return enough structured detail that the user can see what they are confirming: cost, target, schedule, irreversible effects, scope, and anything else needed to catch a mistake. A &quot;Ready to post. Confirm?&quot; prompt with no details is unsafe even when users always click yes.</p>\n<h3>Safety and Confirmation</h3>\n<p>Prompt instructions are not enough for destructive actions. If an operation must always be previewed before execution, do not use <code>dry_run: boolean</code> on a single tool. The model can call the tool with <code>dry_run: false</code>.</p>\n<p>Use a structural pattern:</p>\n<ol><li><code>preview_delete_workspace(workspace_id)</code> returns the impact and a one-time confirmation token.</li><li>The user reviews the impact.</li><li><code>execute_delete_workspace(workspace_id, confirmation_token)</code> requires the token and verifies it matches the previewed action.</li></ol>\n<p>Confirmation content must be meaningful. A prompt that says &quot;Confirm?&quot; is weak. Show the target account, irreversible effects, cost, schedule, destination, and anything a user would need to catch a mistake.</p>\n<p>For ambiguous destructive operations, first resolve the target. If a CRM contains several similarly named contacts, show the candidates with differentiating fields and require the user to choose the intended record.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Encoding format hints in parameter names.</strong> Use descriptions and schemas, not names like <code>date_string_iso_yyyy_mm_dd</code>.</li><li><strong>Making everything a free-text string.</strong> Free text increases ambiguity and invalid combinations.</li><li><strong>Returning only human-readable prose.</strong> Downstream tools need IDs and structured fields.</li><li><strong>Combining decision points.</strong> Composite tools are good for mechanical work, not for hiding choices from the model.</li><li><strong>Assuming annotations or descriptions enforce security.</strong> Security belongs in code, hooks, permissions, and tool logic.</li></ul>", "search": "2. Designing Tool Interfaces for LLM Agents ### What to Know\n\nAn agent selects tools from their names, descriptions, parameter schemas, and examples. Tool design is prompt design plus API design. A good tool interface makes the right action easy and the wrong action difficult or impossible.\n\nGood tool descriptions explain:\n\n- What the tool does.\n- When to use it.\n- When not to use it.\n- Required input formats.\n- What the output contains.\n- Important limitations and safety concerns.\n\nFor complex tools, include `input_examples` when supported. Examples are especially helpful for nested objects, date formats, identifiers, and domain-specific enums.\n\n### Where Tools Run: Client, Server, and Protocol\n\n\"Tool\" covers several execution models, and the architecture differs by who defines the interface and who runs the code:\n\n| Tool Type | Who Defines the Schema | Who Executes | Examples |\n|---|---|---|---|\n| User-defined (client-side) | You | Your application | `search_orders`, `issue_store_credit` |\n| Anthropic-defined (client-side) | Anthropic | Your application | Bash, text editor, computer use, memory |\n| Server-side | Anthropic | Anthropic's infrastructure | Web search, web fetch, code execution |\n| MCP | The MCP server | The MCP server | Connected third-party or internal servers |\n\nThe placement determines the trust boundary and the operational burden:\n\n- Client-side tools execute inside your environment. You get full control — gating, logging, validation, custom UI — and full responsibility for sandboxing and abuse prevention.\n- Server-side tools require no execution infrastructure on your side: declare them in the request and the platform runs them, for example executing generated code in a managed sandbox or performing a web search. You give up the ability to intercept individual calls, so they suit self-contained capabilities rather than actions that must pass through your own approval or audit path.\n- MCP tools execute wherever the server runs, which is why server trust matters (see the MCP section).\n\nA use"}, {"id": "ch-4", "title": "Chapter 3 — Error handling", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>3. Error Handling in Agent Tools</h2><h3>What to Know</h3>\n<p>Tool errors shape agent behavior. A generic failure message forces the model to guess whether it should retry, ask the user, escalate, or stop. Production tools should classify failures and return enough context for the agent to respond appropriately.</p>\n<p>Use these categories:</p>\n<table><tr><th>Category</th><th>Example</th><th>Correct Handling</th></tr><tr><td>Transient infrastructure</td><td>Timeout, 503, connection reset</td><td>Retry inside the tool with backoff when safe</td></tr><tr><td>Permanent validation</td><td>Bad date, invalid enum, malformed ID</td><td>Return structured details so the agent can correct or ask</td></tr><tr><td>Business rule</td><td>Not eligible, duplicate, insufficient balance</td><td>Return non-retryable error with user-facing explanation</td></tr><tr><td>Permission</td><td>Authenticated user lacks access</td><td>Return non-retryable error and escalation/permission path</td></tr><tr><td>Uncertain write state</td><td>Timeout after submitting payment or notification</td><td>Report uncertainty and avoid automatic retry</td></tr></table>\n<p>The tool should absorb recoverable infrastructure noise when it can. If a read-only API times out and immediate retries usually succeed, retry inside the tool. The model does not need to see the first failed network attempt.</p>\n<p>Do not retry blindly when an operation may have already caused a side effect. If a payment, notification, order, or posting request times out after submission, the tool may not know whether it succeeded. Return a structured uncertain-state result and tell the agent not to retry without an idempotency key or explicit user decision.</p>\n<h3>Structured Error Results</h3>\n<p>Return application-level errors as normal tool results, not uncaught exceptions. In MCP, tool execution errors use <code>isError: true</code>; protocol-level failures use JSON-RPC errors.</p>\n<p>Example application-level error:</p>\n<pre><code>{\n  &quot;isError&quot;: true,\n  &quot;content&quot;: [\n    {\n      &quot;type&quot;: &quot;text&quot;,\n      &quot;text&quot;: &quot;{\\&quot;error_category\\&quot;:\\&quot;business_rule\\&quot;,\\&quot;retryable\\&quot;:false,\\&quot;code\\&quot;:\\&quot;warranty_window_closed\\&quot;,\\&quot;customer_explanation\\&quot;:\\&quot;This device is outside the standard warranty window.\\&quot;,\\&quot;next_steps\\&quot;:[\\&quot;offer_paid_repair\\&quot;,\\&quot;escalate_for_exception_review\\&quot;]}&quot;\n    }\n  ]\n}</code></pre>\n<p>A cleaner internal representation might be:</p>\n<pre><code>{\n  &quot;success&quot;: false,\n  &quot;error_category&quot;: &quot;validation&quot;,\n  &quot;retryable&quot;: false,\n  &quot;field&quot;: &quot;shipping_postal_code&quot;,\n  &quot;message&quot;: &quot;Postal code must be 5 digits for US addresses.&quot;,\n  &quot;user_repair&quot;: &quot;Ask the user to confirm the postal code.&quot;\n}</code></pre>\n<h3>MCP Error Tiers</h3>\n<p>MCP tools have two error mechanisms:</p>\n<ul><li><strong>Protocol errors</strong>: the request could not be processed as a protocol operation. Examples: unknown tool, malformed JSON-RPC request, invalid arguments at the protocol boundary (such as a missing required parameter that the schema declares mandatory), unsupported method.</li><li><strong>Tool execution errors</strong>: the tool was invoked, but the underlying operation failed. Examples: upstream API returned 404 because the requested record does not exist, upstream API returned 503 because the service is temporarily unavailable, business rule violation, permission denial, rate limit.</li></ul>\n<p>Concrete example. An <code>check_availability(user_email)</code> tool faces three errors:</p>\n<ol><li>Caller omits <code>user_email</code> entirely, violating the tool&#x27;s input schema. This is a <strong>protocol error</strong> (JSON-RPC error) — the call was not even structurally well-formed.</li><li>The calendar API returns 404 because the user does not exist. The tool was invoked correctly, the operation simply failed. <strong>Tool execution error</strong> with <code>isError: true</code>.</li><li>The calendar API returns 503 because the service is down. Again, the tool was invoked correctly. <strong>Tool execution error</strong> with <code>isError: true</code>.</li></ol>\n<p>Do not turn ordinary business failures into protocol failures. A missing record in the backend is not a JSON-RPC protocol failure; it is a tool execution result with <code>isError: true</code>.</p>\n<h3>Retry Responsibility</h3>\n<p>Place retry logic where the needed information lives.</p>\n<ul><li>Tool-level retry is right for transient backend failures where the same request should succeed (timeout, 503, connection reset on a read).</li><li>Model-level retry is right when the model needs to change inputs or strategy (validation errors, syntax errors in user-provided filters, wrong identifier).</li><li>Human approval is needed when retrying may duplicate a side effect or violate a policy.</li></ul>\n<p>A common production pattern: a <code>search_catalog</code> tool has 12% failures, split between transient timeouts (~8%, succeed on retry) and syntax errors in user filters (~4%, never succeed). Returning both identically wastes turns retrying syntax errors and tells users to &quot;try again later&quot; for timeouts. Correct design: retry transient errors inside the tool with backoff and surface only the final success or failure; surface syntax errors immediately with parameter validation details so the model can correct them or ask the user.</p>\n<p>A <code>retryable: true|false</code> boolean alone is not as effective as actually retrying transient failures inside the tool, because it still costs a model turn and risks the agent retrying anyway.</p>\n<h3>Uncertain Side Effects</h3>\n<p>Writes deserve special care. If a <code>send_notification</code>, <code>process_payment</code>, or <code>post_content</code> request times out <strong>after</strong> submission, the tool may not know whether the side effect occurred. Returning a generic error encourages automatic retry — and that creates duplicate notifications, double charges, or duplicate posts.</p>\n<p>The right behavior:</p>\n<ul><li>Mark the result as an error, but communicate uncertainty in the message: &quot;Timeout — delivery status unknown. Message may have been sent. Avoid retry without idempotency check.&quot;</li><li>Do not flag it as <code>retry_safe: true</code>.</li><li>Encourage the agent to verify with a separate status lookup, or to confirm with the user before acting.</li></ul>\n<p>This is the inverse of read-side timeouts where retrying is usually safe.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Throwing exceptions for expected business errors.</strong> Frameworks often hide exception details from the model.</li><li><strong>Marking uncertain side effects as retryable.</strong> This causes duplicates.</li><li><strong>Returning empty data for backend failures.</strong> An empty list means &quot;success with no matches,&quot; not &quot;the API failed.&quot;</li><li><strong>Making the model parse free-text errors.</strong> Give it structured fields.</li></ul>", "search": "3. Error Handling in Agent Tools ### What to Know\n\nTool errors shape agent behavior. A generic failure message forces the model to guess whether it should retry, ask the user, escalate, or stop. Production tools should classify failures and return enough context for the agent to respond appropriately.\n\nUse these categories:\n\n| Category | Example | Correct Handling |\n|---|---|---|\n| Transient infrastructure | Timeout, 503, connection reset | Retry inside the tool with backoff when safe |\n| Permanent validation | Bad date, invalid enum, malformed ID | Return structured details so the agent can correct or ask |\n| Business rule | Not eligible, duplicate, insufficient balance | Return non-retryable error with user-facing explanation |\n| Permission | Authenticated user lacks access | Return non-retryable error and escalation/permission path |\n| Uncertain write state | Timeout after submitting payment or notification | Report uncertainty and avoid automatic retry |\n\nThe tool should absorb recoverable infrastructure noise when it can. If a read-only API times out and immediate retries usually succeed, retry inside the tool. The model does not need to see the first failed network attempt.\n\nDo not retry blindly when an operation may have already caused a side effect. If a payment, notification, order, or posting request times out after submission, the tool may not know whether it succeeded. Return a structured uncertain-state result and tell the agent not to retry without an idempotency key or explicit user decision.\n\n### Structured Error Results\n\nReturn application-level errors as normal tool results, not uncaught exceptions. In MCP, tool execution errors use `isError: true`; protocol-level failures use JSON-RPC errors.\n\nExample application-level error:\n\n```json\n{\n  \"isError\": true,\n  \"content\": [\n    {\n      \"type\": \"text\",\n      \"text\": \"{\\\"error_category\\\":\\\"business_rule\\\",\\\"retryable\\\":false,\\\"code\\\":\\\"warranty_window_closed\\\",\\\"customer_explanation\\\":\\\"This device is outside the standard warranty wind"}, {"id": "ch-5", "title": "Chapter 4 — Extraction and validation", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>4. Structured Data Extraction and Validation</h2><h3>What to Know</h3>\n<p>Structured extraction is a first-class architecture problem. The goal is not merely valid JSON. The goal is data that is syntactically valid, semantically correct, traceable to the source, and safe for downstream systems.</p>\n<p>Use schema-backed output for extraction. On current Claude APIs, that may mean <code>output_config.format</code> JSON structured outputs for direct JSON responses, or tool use/strict tool use when the extraction is represented as a tool call. Prompt-only JSON can work for low-risk prototypes, but it is not the best choice for production pipelines that feed databases, workflow engines, or audits.</p>\n<h3>Schema Design</h3>\n<p>Schema constraints help shape the output, but they do not prove that the source supports the value. A schema can verify that <code>attendee_count</code> is an integer; it cannot verify that the article actually stated an attendee count.</p>\n<p>Use optional or nullable fields for information that may be absent. If a field is required even when the source may not contain it, the model is pressured to fabricate. Teach the extractor to return <code>null</code>, an empty array, or an explicit absence reason when information is not stated.</p>\n<p>Choose absence semantics deliberately:</p>\n<table><tr><th>Situation</th><th>Schema Pattern</th></tr><tr><td>Field may not appear in source</td><td>Optional field or nullable value</td></tr><tr><td>List may be explicitly empty</td><td>Empty array allowed</td></tr><tr><td>List item unknown but field exists</td><td>Item with <code>value: null</code> and <code>reason</code></td></tr><tr><td>Ambiguous classification</td><td>Add enum value such as <code>unclear</code></td></tr><tr><td>Open-ended category set</td><td>Enum plus <code>other_detail</code>, or string plus normalization</td></tr></table>\n<p>Closed enums are good when the domain is stable. If new categories appear constantly, a strict enum without escape hatch creates validation failures. A common design is:</p>\n<pre><code>{\n  &quot;equipment_type&quot;: {\n    &quot;type&quot;: &quot;string&quot;,\n    &quot;enum&quot;: [&quot;laptop&quot;, &quot;monitor&quot;, &quot;printer&quot;, &quot;network_device&quot;, &quot;other&quot;]\n  },\n  &quot;equipment_type_detail&quot;: {\n    &quot;type&quot;: [&quot;string&quot;, &quot;null&quot;],\n    &quot;description&quot;: &quot;Original source wording when equipment_type is other.&quot;\n  }\n}</code></pre>\n<h3>Reducing Fabrication</h3>\n<p>Use instructions and examples that distinguish extraction from inference:</p>\n<ul><li>&quot;Extract only values stated in the source.&quot;</li><li>&quot;Use <code>null</code> when the source does not provide the information.&quot;</li><li>&quot;Do not infer missing values from typical examples.&quot;</li><li>&quot;Preserve informal measurements verbatim when no precise value is given.&quot;</li></ul>\n<p>Schema design also affects fabrication. If a field is required but the source rarely contains the information, the model is structurally pressured to invent values. Make these fields optional or nullable.</p>\n<p>A common alternative — running a second LLM call to &quot;verify&quot; extracted values against the source — is generally inferior to fixing the schema. Verification calls add cost and latency, can themselves hallucinate or rationalize the original answer, and do not address the root cause: the model produced a value because the schema demanded one. Allowing <code>null</code> (or <code>unclear</code>, or <code>not_stated</code>) lets the first call signal absence directly, which is both cheaper and more honest. Use a verification pass only as a sampling-based audit on already-good extractions, not as a fix for fabrication caused by overly strict schemas.</p>\n<p>Allow <code>null</code> rather than empty arrays when the distinction matters semantically. An empty <code>pros</code> array often reads as &quot;the reviewer mentioned no pros,&quot; which is a real claim. <code>null</code> reads as &quot;the document did not address pros,&quot; which is closer to the truth for very short reviews. Similarly, an enum like <code>[&quot;positive&quot;, &quot;negative&quot;, &quot;mixed&quot;]</code> should grow an <code>unclear</code> value when sarcasm or ambiguity is common, so the model has a correct option instead of being forced to pick.</p>\n<p>Few-shot examples are especially effective when the model is inconsistent across varied document structures. Show complete input-output pairs for edge cases: missing data, ambiguous sentiment, informal units, compound skills, multiple values, amendments, and values buried in nonstandard sections. They are also more effective than verbose written rules at teaching subtle distinctions: when standardized formats matter (for example, &quot;cotton blend&quot; vs &quot;Cotton/Polyester mix&quot;), 2–3 input/output examples teach the format more reliably than narrative instructions.</p>\n<p>A specific failure pattern: a strict enum without escape hatch fails when new categories keep appearing. Add an <code>other</code> enum value with a paired <code>*_detail</code> string field for the source&#x27;s actual wording. This handles long-tail categories without rewriting the schema each time a new category appears.</p>\n<h3>Source Grounding and Provenance</h3>\n<p>For high-stakes extraction, include provenance fields:</p>\n<pre><code>{\n  &quot;field&quot;: &quot;termination_notice_days&quot;,\n  &quot;value&quot;: 45,\n  &quot;source_location&quot;: &quot;Amendment 2, section 4&quot;,\n  &quot;source_quote&quot;: &quot;The notice period is amended to forty-five days.&quot;,\n  &quot;effective_date&quot;: &quot;2026-01-01&quot;\n}</code></pre>\n<p>This is critical when:</p>\n<ul><li>Source documents contain amendments.</li><li>Multiple sections contain conflicting values.</li><li>Final reports need citations.</li><li>Human reviewers must audit the model&#x27;s choices.</li></ul>\n<p>API-level citation features can help for narrative answers over documents, but strict JSON structured outputs and citations may be incompatible because citations require interleaved citation blocks while JSON schemas require constrained JSON. When you need structured extraction plus provenance, represent source locations explicitly in your schema instead of assuming the citation feature can be attached to every JSON field.</p>\n<p>For documents with amendments, a single scalar field may be the wrong schema. Capture original and amended values with effective dates and locations. For documents with a known precedence rule, such as &quot;use the detailed specifications table over marketing summary text,&quot; include that rule in the extraction instructions and keep the schema simple.</p>\n<h3>Semantic Validation</h3>\n<p>JSON Schema, structured outputs, strict tool use, and Pydantic catch type, presence, enum, and shape errors. They do not catch every semantic error. Add domain validation:</p>\n<ul><li>Line items sum to totals.</li><li>Dates fall within allowed ranges.</li><li>IDs match known formats or known records.</li><li>Required citations exist in the source.</li><li>Fields are not copied into the wrong category (a duration is not an ingredient quantity, a competitor&#x27;s specs are not the product&#x27;s specs).</li></ul>\n<p>When validation fails, do not blindly retry the same request. Send a correction request that includes the source document, the previous extraction, and the exact validation errors. This is much more effective than asking the model to &quot;try again&quot; — and far more effective than setting <code>temperature: 0</code>, which only removes variability without addressing the underlying mismatch.</p>\n<p>Example correction prompt structure:</p>\n<pre><code>The extraction below failed validation.\n\nValidation errors:\n- line_items_total does not equal stated_total\n- vendor_id does not match the expected pattern\n\nReturn a corrected call to extract_invoice. Do not change fields unless needed to fix the errors.</code></pre>\n<p>For fields prone to internal inconsistency (such as line items vs grand total on invoices), add explicit reconciliation fields to your schema:</p>\n<pre><code>{\n  &quot;line_items&quot;: [...],\n  &quot;calculated_total&quot;: 1280.5,\n  &quot;stated_total&quot;: 1295.0,\n  &quot;totals_match&quot;: false\n}</code></pre>\n<p>Then flag mismatches automatically. This catches both OCR errors and extraction mistakes without forcing the model to reconcile values it cannot verify.</p>\n<h4>When Retries Don&#x27;t Help</h4>\n<p>Some failures cannot be fixed by retrying with the same input:</p>\n<ul><li>The information is in an external document that was not provided to the model. Retries will only produce hallucinated values.</li><li>The schema requires a different format than the source provides (for example, the schema requires a flat array of strings but the source organizes the data as a nested object). The model can usually fix this on retry with feedback.</li><li>A locale-formatted number (&quot;1,234&quot;) needs to become an integer (1234). Easily fixed on retry.</li><li>A date is given as ISO 8601 datetime but the schema requires only the date portion. Easily fixed on retry.</li></ul>\n<p>The first case is the only one where additional retries are unproductive. Retrieve the missing source or route to human review instead.</p>\n<h3>Long and Scattered Documents</h3>\n<p>Long documents can fit in the context window and still be hard to extract from when facts are scattered, repeated, or revised over time. Accuracy often improves when you split the task into stages:</p>\n<ol><li>Identify and summarize the relevant sections, decisions, tables, or events.</li><li>Extract structured data from that focused intermediate representation.</li><li>Preserve source locations so the extraction can be audited against the original.</li></ol>\n<p>Use chunking when documents exceed context limits or when independent sections can be processed separately. Use a pre-extraction summarization or mapping step when the document fits but the key facts are distributed across a meandering transcript, long contract, or multi-section report. Chunking alone can lose cross-section relationships; summarization alone can lose exact values. Choose based on the failure mode.</p>\n<p>For long-but-in-context inputs (a sprawling meeting transcript, a long support thread, an unstructured incident report) where the source fits but key facts are buried among unrelated content, a model-driven pre-extraction pass usually outperforms both raw extraction with more few-shot examples and mechanical chunking. Add a first call that asks the model to surface the relevant sections — decisions, action items, named entities, dollar amounts, dates — into a structured intermediate. Then run extraction against that intermediate. The intermediate keeps the model focused on the parts that matter and substantially reduces the rate at which scattered details are missed or conflated. Few-shot examples help when extraction patterns are unusual; they do not by themselves help the model find a needle in a haystack. Chunking spreads the haystack across requests but loses cross-chunk relationships. Pre-extraction summarization preserves both.</p>\n<h3>Confidence and Human Review</h3>\n<p>Self-reported confidence is useful only after calibration. Do not assume <code>confidence: 0.92</code> means 92% accuracy. Build a labeled validation set and measure accuracy by document type, field, source quality, and confidence band.</p>\n<p>Better than a raw confidence score alone:</p>\n<pre><code>{\n  &quot;amount_due&quot;: {\n    &quot;value&quot;: 1280.5,\n    &quot;confidence&quot;: 0.88,\n    &quot;requires_review&quot;: true,\n    &quot;review_reasons&quot;: [&quot;total_mismatch&quot;, &quot;low_ocr_quality&quot;]\n  }\n}</code></pre>\n<p>Route human review based on:</p>\n<ul><li>Low calibrated confidence.</li><li>Ambiguous or contradictory source content.</li><li>High-impact fields.</li><li>Failed semantic validation.</li><li>New or historically error-prone document types.</li></ul>\n<h4>Validating Automation Plans</h4>\n<p>Before automating high-confidence extractions, do not just verify aggregate accuracy. A pipeline that is 97% accurate overall can still be 80% accurate on a specific document type or field. Break down accuracy by segment (document type, field, source) before raising the automation threshold. Lowering the threshold or comparing thresholds before that segment-level analysis is premature.</p>\n<p>Even after automation begins, sample high-confidence outputs continuously. Use stratified random review of a fixed percentage to detect hidden error patterns and measure whether improvements actually reduce error rates. Lowering the threshold or relying only on downstream complaints misses systematic errors that look reasonable to humans not reading the source.</p>\n<h3>Feedback Loops</h3>\n<p>Human corrections should feed prompt and schema improvements. Look for recurring patterns:</p>\n<ul><li>Informal units being converted incorrectly.</li><li>Compound phrases split inconsistently.</li><li>Missing fields in nonstandard sections.</li><li>False positives in code review findings.</li><li>Repeated validation failures by field.</li></ul>\n<p>When you observe a clear recurring failure mode (for example, &quot;informal measurements like &#x27;a handful&#x27; or &#x27;a splash&#x27; get either invented or omitted in 23% of corrections&quot;), the highest-leverage change is usually adding a few-shot example demonstrating the correct handling — extracting the informal phrase verbatim. Fine-tuning, regex post-processing, or new schema fields are heavier interventions that can be considered only if focused prompt/schema improvements do not move the metric.</p>\n<p>For dismissed code-review findings, add fields like <code>detected_pattern</code>, <code>rule_id</code>, or <code>evidence</code> so analysts can see <em>what kind of code construct</em> triggered each finding. Aggregate dismiss rates by pattern, then update the prompt criteria for the over-reporting patterns. Without that field, you can only see &quot;35% are dismissed,&quot; not which constructs to suppress.</p>\n<h3>Batch Extraction</h3>\n<p>For high-volume asynchronous extraction, the Message Batches API can reduce cost but adds latency. Use it when the workflow tolerates delayed results. Use real-time Messages API for urgent documents, interactive user flows, or SLA-sensitive alerts.</p>\n<p>Batch requests have <code>custom_id</code> values. Results may not arrive in the same order as requests, so always join results by <code>custom_id</code>. If a small percentage fail due to context length or validation errors, resubmit only the failed documents after fixing the cause, such as chunking long inputs or improving the prompt.</p>\n<p>For mixed urgency, route per-document, not per-batch. Standard documents go to the Batch API for cost savings; urgent ones go to the real-time Messages API to meet tight latency SLAs. Trying to batch everything and then expedite urgent documents inside the batch defeats the purpose — batch processing latency is the main reason urgent items cannot use it.</p>\n<p>For one-shot bulk extraction with a deadline (for example, 50,000 documents under a two-week deadline where a meaningful percentage will need prompt iteration), submit everything to the Batch API for the bulk discount, then submit the failures in successive batches with refined prompts. Sequencing 10 sequential batches of 5,000 each costs more in calendar time and does not buy meaningful learning. Sampling first via real-time API can help characterize failure modes, but it is a small slice of the overall workload, not the main strategy.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Treating valid JSON as correct data.</strong> Syntax validation is only the first layer.</li><li><strong>Confusing schema compliance with source truth.</strong> A constrained decoder can guarantee shape, not that the source supports the value.</li><li><strong>Making absent source fields required.</strong> This encourages hallucination.</li><li><strong>Using strict enums without escape hatches in evolving domains.</strong> Add <code>other</code> plus detail or normalize later.</li><li><strong>Relying only on aggregate accuracy.</strong> Accuracy can hide poor performance for specific fields or document types.</li><li><strong>Sending all long documents through one extraction call.</strong> Chunk, summarize first, or use staged extraction when information is scattered.</li></ul>", "search": "4. Structured Data Extraction and Validation ### What to Know\n\nStructured extraction is a first-class architecture problem. The goal is not merely valid JSON. The goal is data that is syntactically valid, semantically correct, traceable to the source, and safe for downstream systems.\n\nUse schema-backed output for extraction. On current Claude APIs, that may mean `output_config.format` JSON structured outputs for direct JSON responses, or tool use/strict tool use when the extraction is represented as a tool call. Prompt-only JSON can work for low-risk prototypes, but it is not the best choice for production pipelines that feed databases, workflow engines, or audits.\n\n### Schema Design\n\nSchema constraints help shape the output, but they do not prove that the source supports the value. A schema can verify that `attendee_count` is an integer; it cannot verify that the article actually stated an attendee count.\n\nUse optional or nullable fields for information that may be absent. If a field is required even when the source may not contain it, the model is pressured to fabricate. Teach the extractor to return `null`, an empty array, or an explicit absence reason when information is not stated.\n\nChoose absence semantics deliberately:\n\n| Situation | Schema Pattern |\n|---|---|\n| Field may not appear in source | Optional field or nullable value |\n| List may be explicitly empty | Empty array allowed |\n| List item unknown but field exists | Item with `value: null` and `reason` |\n| Ambiguous classification | Add enum value such as `unclear` |\n| Open-ended category set | Enum plus `other_detail`, or string plus normalization |\n\nClosed enums are good when the domain is stable. If new categories appear constantly, a strict enum without escape hatch creates validation failures. A common design is:\n\n```json\n{\n  \"equipment_type\": {\n    \"type\": \"string\",\n    \"enum\": [\"laptop\", \"monitor\", \"printer\", \"network_device\", \"other\"]\n  },\n  \"equipment_type_detail\": {\n    \"type\": [\"string\", \"null\"],\n    \"description\": \"Original source wordi"}, {"id": "ch-6", "title": "Chapter 5 — Context management", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>5. Conversation Context Management</h2><h3>What to Know</h3>\n<p>Context management is state management. The model sees a request, not your database. You decide what to include.</p>\n<p>The right context strategy depends on what must be preserved:</p>\n<table><tr><th>Need</th><th>Best Strategy</th></tr><tr><td>Recent conversational flow</td><td>Keep recent turns verbatim</td></tr><tr><td>Long-term narrative continuity</td><td>Progressive summaries with decisions and themes</td></tr><tr><td>Current user preferences</td><td>Structured state object</td></tr><tr><td>Exact facts and numbers</td><td>Retrieval from source or structured fact store</td></tr><tr><td>Persistent creative canon</td><td>Compact &quot;bible&quot; or reference section</td></tr><tr><td>Tool-heavy workflows</td><td>Extract relevant fields and discard verbose payloads</td></tr></table>\n<h3>Sliding Window</h3>\n<p>A sliding window keeps the most recent messages and drops older ones. It is simple and cheap. It works when older context is rarely needed. It fails when users refer back to earlier decisions, preferences, or exact data.</p>\n<p>Use sliding windows when production logs show older messages are rarely referenced — for example, when 94% of user messages only reference the previous 3-5 exchanges and the remaining 6% ask about information users could easily re-state. In that traffic profile, a sliding window keeping the last 8-10 turns plus the system prompt restores response speed and quality. When users do reach back, the assistant can ask them to re-state the relevant information.</p>\n<p>Sliding windows are also the right tool for <strong>accumulated RAG results</strong>. If RAG retrievals from many earlier queries pile up alongside the conversation, they crowd out turn-by-turn coherence. Apply a sliding window specifically to RAG results (keep the last 2-3 retrievals) while preserving conversation history under its own policy. Aggressive deduplication or summarizing all RAG into one digest is more complicated and rarely better.</p>\n<h3>Progressive Summarization</h3>\n<p>Progressive summarization replaces older conversation blocks with a running summary while keeping recent turns verbatim. A useful summary is structured:</p>\n<pre><code>Decisions:\n- The user selected option B because it preserves existing integrations.\n\nCurrent preferences:\n- Budget target: $8,000.\n- Avoid vendor lock-in.\n\nOpen questions:\n- Confirm whether the migration must support offline mode.\n\nImportant facts:\n- Existing system processes about 40K records per day.</code></pre>\n<p>Bad summaries are vague narratives. They lose the exact facts that users later ask about. When information matters specifically — themes of past discussions, narrative continuity across many sessions, the group&#x27;s prior conclusions — summaries should explicitly extract decisions, conclusions, and recurring themes rather than producing prose that &quot;describes the conversation.&quot;</p>\n<p>Use a hybrid approach for ongoing conversations: replace older turns with structured summaries, keep the most recent turns verbatim. Increasing the sliding window from 25 to 50 turns is rarely the right answer; it just defers the limit. Hybrid summarization preserves long-term continuity at much lower token cost.</p>\n<h3>Persistent Reference Sections</h3>\n<p>Some content must remain exact and stable across the whole conversation, even when the surrounding discussion is ephemeral. Examples:</p>\n<ul><li>Story bibles: character backgrounds, plot structure, world rules.</li><li>User-defined terms: &quot;room temperature butter means 68°F in this kitchen.&quot;</li><li>Critical safety info: allergies, medication interactions.</li><li>Active scaling parameters: &quot;scale all recipes to 8 servings.&quot;</li></ul>\n<p>Separate these into a retained reference section at the start of context. Apply trimming or summarization only to the surrounding discussion. Mixing the two and applying a single summarization pass risks losing the exact details the user expects to remain consistent.</p>\n<p>For dinner-party-style sessions where the conversation includes both critical structured data (allergies, serving counts, definitions) and general back-and-forth (timing, presentation), the right strategy combines several techniques: extract critical data into a compact reference section, summarize general discussion, and retain recent exchanges verbatim. A pure sliding window loses the allergies; a single summary blurs the exact serving count.</p>\n<h3>Structured State</h3>\n<p>When users revise preferences mid-conversation, maintain a canonical state object that represents current truth:</p>\n<pre><code>{\n  &quot;workspace_search&quot;: {\n    &quot;monthly_budget_max&quot;: 4200,\n    &quot;space_type&quot;: &quot;private_office&quot;,\n    &quot;must_have&quot;: [&quot;bike storage&quot;, &quot;after-hours access&quot;],\n    &quot;no_longer_relevant&quot;: [&quot;shared desk&quot;]\n  }\n}</code></pre>\n<p>Update the object whenever the user changes a preference. Include it in each request. This is more reliable than:</p>\n<ul><li>Expecting the model to infer current truth from a long conversation containing old and new values.</li><li>Adding system prompt instructions like &quot;always prioritize the most recently stated preferences.&quot; The model usually does, but not reliably enough.</li><li>Pruning old turns. Pruning may remove important context for other reasons.</li><li>Few-shot examples of &quot;the assistant correctly applies preference changes.&quot; These help framing but do not give the model a single source of truth.</li></ul>\n<p>When preferences conflict, do not silently pick one if the decision matters. A user who says &quot;I have very low risk tolerance&quot; and later says &quot;I want to maximize my returns like my friends did with crypto&quot; has stated incompatible goals. The right behavior is to surface the contradiction and ask which priority should govern. A balanced compromise risks recommending something that fits neither stated preference.</p>\n<p>The same principle applies to multi-issue customer sessions. If a customer raises three separate issues across 45 turns (a refund, a subscription question, a payment update), structured state can track each issue&#x27;s current status — order ID, amounts, resolution state — independently of the linear conversation, so the agent can reliably answer &quot;what happened with my refund?&quot; later in the session.</p>\n<h3>Retrieval and Fact Stores</h3>\n<p>Summaries lose precision. If users need exact p-values, source quotes, clauses, measurements, transaction IDs, or numeric thresholds, store facts in a structured database or retrieve the relevant source passage when needed.</p>\n<p>For research assistants, combine:</p>\n<ul><li>Summaries for the interpretive discussion.</li><li>Source retrieval for exact claims.</li><li>Structured fact tables for recurring numerical lookups.</li></ul>\n<p>A common pattern: a research assistant summarizes paper discussions after 8 turns to control context, but then users ask follow-up questions requiring precise numerical details (sample sizes, p-values, inclusion criteria) that the summaries blurred. Two design responses both work, but the most direct fix is to <strong>re-inject relevant source sections on demand</strong> when a user&#x27;s question signals they need precision. A separate structured fact store of every numerical detail is heavier and may not match the variety of follow-ups; &quot;higher fidelity summaries&quot; that preserve all numbers tend to balloon back into the original document. On-demand retrieval scales better.</p>\n<h3>Tool Result Compression</h3>\n<p>Verbose tool results can crowd out useful conversation. After a tool result has been processed, extract the fields that matter and drop the rest.</p>\n<p>Example: after retrieving order details, keep <code>order_id</code>, <code>purchase_date</code>, <code>items</code>, <code>return_window</code>, <code>payment_status</code>, and <code>resolution_state</code>; discard internal backend fields, unrelated shipping events, and duplicated metadata. If a <code>lookup_order</code> tool returns 40+ fields and the agent has called it multiple times for an investigation into return requests, those tool outputs can come to dominate context. Compressing each prior order response to its return-relevant fields, then making additional lookups, is more reliable than continuing to accumulate raw responses, summarizing them all into prose, or moving them to a vector database for retrieval.</p>\n<h3>API-Native Context Management</h3>\n<p>The strategies above are application-level: your code decides what to keep, summarize, or drop. The platform also offers API-native mechanisms that do related work server-side:</p>\n<ul><li><strong>Compaction</strong> summarizes earlier conversation history into a compact block when the context approaches its limit, letting long-running sessions continue past the window. The summary replaces older turns, and your application passes the compaction block back on subsequent requests.</li><li><strong>Context editing</strong> clears stale content — typically old tool results — from the transcript based on configurable thresholds. It prunes rather than summarizes.</li><li>Agentic products often build on these: Claude Code, for example, automatically compacts long sessions so work can continue.</li></ul>\n<p>Choosing between application-level and API-native management is itself an architecture decision:</p>\n<ul><li>Application-level strategies give you control and portability. You decide exactly what survives — structured state, reference sections, fact stores — and the logic works regardless of provider or model version. They are the right tool when specific facts must survive verbatim.</li><li>API-native compaction and editing reduce plumbing: there is no summarization pipeline to build or tune. They are the right tool when the goal is simply &quot;keep a long session alive&quot; and the application has no strong opinion about what to preserve.</li><li>The two compose. A production agent can maintain a structured state object (application-level) while relying on compaction to handle the long tail of conversational history.</li></ul>\n<p>A related signal is the stop reason: if a response ends because the conversation no longer fits the model&#x27;s context window, that is the trigger to compact, trim, or summarize — not to retry the same oversized request (see the stop reasons table in the Model Selection and Inference Controls section).</p>\n<h3>Returning Users and Stale Data</h3>\n<p>Tool results age. A user returning hours later should not be served from stale tool outputs embedded in an old transcript. Start with a structured summary of prior interaction, then fetch fresh state before making claims about current status.</p>\n<p>Good returning-session summary:</p>\n<pre><code>{\n  &quot;user_issue&quot;: &quot;billing adjustment requested&quot;,\n  &quot;prior_actions&quot;: [&quot;validated identity&quot;, &quot;opened case&quot;],\n  &quot;known_ids&quot;: [&quot;case_9138&quot;, &quot;invoice_2044&quot;],\n  &quot;last_known_status&quot;: &quot;pending as of 2026-04-28T15:30:00Z&quot;,\n  &quot;fresh_lookup_required&quot;: true\n}</code></pre>\n<p>Why not just resume the old session and add an instruction telling the agent to &quot;prefer the most recent tool results&quot;? Because the agent often references old tool results regardless of instructions, especially when the older results are more detailed than the newer ones. Filtering tool_result messages from the resumed history risks confusing the model about why earlier turns reference data it cannot see. Configuring the agent to re-call all previous tools at session start wastes calls on tools whose results may not be relevant to the new question. Starting fresh with a structured summary plus targeted fresh lookups is the most reliable pattern.</p>\n<h3>External Updates During a Conversation</h3>\n<p>When an external system receives new information during an active chat, include the fresh state in the next model request. Depending on your architecture, this may be a system/application context block, an injected state section, or a prefix attached to the next user turn. The important principles:</p>\n<ul><li>Do not expect Claude to know about events outside the request.</li><li>Do not generate unsolicited assistant messages unless the product intentionally supports proactive notifications.</li><li>Make current state clearly more authoritative than stale prior tool results.</li></ul>\n<h3>System Prompt Versioning</h3>\n<p>If you change a system prompt for users with ongoing multi-session conversations, old context may conflict with new behavior. Version system prompts and associate each conversation with the version it started under, or use a deliberate migration strategy. Applying a new persona or policy midstream can cause contradictions.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Confusing context capacity with attention.</strong> A large context window — hundreds of thousands of tokens on current models — does not mean every detail is equally salient.</li><li><strong>Summarizing exact facts into vague prose.</strong> Use structured facts or retrieval when precision matters.</li><li><strong>Keeping every RAG result forever.</strong> Use a sliding window for retrieved context unless earlier results remain relevant.</li><li><strong>Resuming old transcripts with stale tool results.</strong> Summaries plus fresh lookups are safer.</li></ul>", "search": "5. Conversation Context Management ### What to Know\n\nContext management is state management. The model sees a request, not your database. You decide what to include.\n\nThe right context strategy depends on what must be preserved:\n\n| Need | Best Strategy |\n|---|---|\n| Recent conversational flow | Keep recent turns verbatim |\n| Long-term narrative continuity | Progressive summaries with decisions and themes |\n| Current user preferences | Structured state object |\n| Exact facts and numbers | Retrieval from source or structured fact store |\n| Persistent creative canon | Compact \"bible\" or reference section |\n| Tool-heavy workflows | Extract relevant fields and discard verbose payloads |\n\n### Sliding Window\n\nA sliding window keeps the most recent messages and drops older ones. It is simple and cheap. It works when older context is rarely needed. It fails when users refer back to earlier decisions, preferences, or exact data.\n\nUse sliding windows when production logs show older messages are rarely referenced — for example, when 94% of user messages only reference the previous 3-5 exchanges and the remaining 6% ask about information users could easily re-state. In that traffic profile, a sliding window keeping the last 8-10 turns plus the system prompt restores response speed and quality. When users do reach back, the assistant can ask them to re-state the relevant information.\n\nSliding windows are also the right tool for **accumulated RAG results**. If RAG retrievals from many earlier queries pile up alongside the conversation, they crowd out turn-by-turn coherence. Apply a sliding window specifically to RAG results (keep the last 2-3 retrievals) while preserving conversation history under its own policy. Aggressive deduplication or summarizing all RAG into one digest is more complicated and rarely better.\n\n### Progressive Summarization\n\nProgressive summarization replaces older conversation blocks with a running summary while keeping recent turns verbatim. A useful summary is structured:\n\n```text\nDecisions:"}, {"id": "ch-7", "title": "Chapter 6 — System prompts", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>6. System Prompt Engineering and Conversational Behavior</h2><h3>What to Know</h3>\n<p>The system prompt defines role, tone, constraints, and priorities. It should be included in every request. It is not a one-time initialization message.</p>\n<p>A common confusion is &quot;the system prompt is sent only on the first turn and Claude remembers it.&quot; That model is wrong. Claude has no memory between API calls. The system prompt and the full message history must be sent on every request. If your application omits the system prompt on later turns, behavior will diverge from the configured persona immediately, not gradually. Likewise, prior assistant and user messages must be sent in the <code>messages</code> array, even when their content seems redundant — the model has no other way to see them.</p>\n<p>A separate effect is real, however: even when the system prompt is included on every call, <strong>attention to it weakens as the conversation grows.</strong> This is not because the prompt is &quot;dropped.&quot; It is because the model&#x27;s recent assistant outputs and the latest user turns increasingly compete for attention with the system prompt. After many turns, behavior can drift even though the system prompt is unchanged and the context window is not full. The fix is structural — reinforce key instructions at natural breakpoints, version the prompt for long-lived sessions, and move hard requirements into code or tool implementations.</p>\n<p>Good system prompts use clear sections:</p>\n<pre><code>&lt;role&gt;\nYou are a careful financial education assistant.\n&lt;/role&gt;\n\n&lt;style&gt;\nUse plain language for beginners. Match the user&#x27;s demonstrated sophistication.\n&lt;/style&gt;\n\n&lt;safety&gt;\nIf the user asks for personalized investment, legal, or medical decisions, explain limits and recommend a qualified professional where appropriate.\n&lt;/safety&gt;\n\n&lt;examples&gt;\n...\n&lt;/examples&gt;</code></pre>\n<p>XML-style tags are not magic, but they improve salience and organization. They are particularly helpful when the same word means different things in different contexts (a <code>&lt;role&gt;</code> block clearly separates persona from a <code>&lt;style&gt;</code> block, even if both reference &quot;tone&quot;), and when you want examples or constraints to be referenceable later in the conversation (&quot;apply the rule from <code>&lt;safety&gt;</code>&quot;).</p>\n<p>When external systems update state mid-session — for example, a webhook reports that an order has shipped, or a billing event flips a customer&#x27;s plan — the right place to surface that change is the system prompt for the next call, not buried inside a tool result. The system prompt is the natural home for &quot;what is currently true about this user, account, or environment.&quot; Tool results are appropriate when the agent itself called for the information; system-prompt updates are appropriate when state changed without the agent asking.</p>\n<p>One cost to weigh: prompt caching matches on an exact prefix, and the system prompt sits at the front of that prefix. Rewriting it on every state change invalidates the cached prefix for the whole conversation. A high-traffic cached agent may therefore be better served by keeping the system prompt stable and injecting fast-changing state later in the context — for example, as a clearly labeled state block alongside the latest user turn. See the Prompt Caching section for the full trade-off.</p>\n<h3>Principles vs Conditionals</h3>\n<p>Use general principles for judgment-heavy behavior:</p>\n<ul><li>&quot;Adapt explanation depth to the user&#x27;s demonstrated expertise.&quot;</li><li>&quot;Prefer one clarifying question at a time.&quot;</li><li>&quot;State reasonable assumptions when moving forward under ambiguity.&quot;</li></ul>\n<p>Use explicit conditionals for safety-critical triggers:</p>\n<ul><li>&quot;If the user describes an immediate medical emergency, direct them to emergency services.&quot;</li><li>&quot;If the request requires a regulated financial decision, do not provide personalized advice.&quot;</li></ul>\n<p>If a rule must hold 100% of the time, move it out of the prompt and into code.</p>\n<p>A common over-correction is to translate every nuanced behavior into an explicit conditional. This rarely improves behavior and often hurts it. Consider an assistant that should adapt explanation depth to demonstrated user expertise. A general principle (&quot;Adapt depth to the user&#x27;s demonstrated proficiency, increasing detail when their questions show domain familiarity&quot;) lets the model integrate dozens of implicit signals — vocabulary, framing, follow-up specificity, the level of error in their guesses. A long list of conditionals (&quot;If user mentions X, assume novice; if user uses term Y, assume intermediate…&quot;) forces the model into a shallow keyword match and tends to misclassify users who phrase things atypically. Use principles for judgment; reserve conditionals for safety triggers and policy bright lines.</p>\n<h3>Few-Shot Examples</h3>\n<p>Examples often outperform long prose instructions. Use examples when you need the model to learn distinctions:</p>\n<ul><li>Beginner vs expert explanations.</li><li>Acceptable vs reportable code review findings.</li><li>Correct extraction from unusual document layouts.</li><li>Good vs bad clarifying-question behavior.</li><li>Handling missing information without fabrication.</li></ul>\n<p>Keep examples realistic and compact. Show the exact behavior you want.</p>\n<p>When a system prompt has grown into long bulleted rule lists, behavior often drifts because the model cannot keep all rules salient at once. Replacing chunks of those rules with two or three contrasting examples typically restores adherence: rather than telling the model in seven sentences how to summarize a beginner&#x27;s question vs an expert&#x27;s question, show it both. Examples are denser than prose for behavior the model needs to learn rather than recite.</p>\n<h3>Prompt Dilution</h3>\n<p>System prompt adherence can weaken as conversation grows, even before the context window is full. The assistant&#x27;s previous responses become a behavioral pattern. Mitigations:</p>\n<ul><li>Use concise, well-structured system prompts.</li><li>Put critical instructions in salient sections.</li><li>Include behavioral examples.</li><li>Add natural reminders before complex tasks.</li><li>Validate or enforce important rules outside the model.</li></ul>\n<p>For long-running workflows, reinforcement can be inserted as application state or user-role reminders at natural breakpoints. Avoid cluttering every turn with giant repeated instructions.</p>\n<p>Concretely, two reinforcement patterns work well:</p>\n<ul><li><strong>User-role reminders at natural breakpoints.</strong> When a session crosses a phase change — finishing one task and starting another, returning after a long idle period, switching topics — append a brief user-role message that re-states the current operating constraints. This is more effective than re-sending the entire system prompt because it integrates with the conversational flow the model is already attending to.</li><li><strong>System prompt versioning across long sessions.</strong> For multi-day or multi-session conversations, allow the application to update the system prompt between turns to reflect what is now true (the user&#x27;s current plan, latest decisions, completed steps). Treat the system prompt as living configuration, not a static initialization string. The full conversation messages still go in <code>messages</code>; the system prompt carries &quot;what currently holds&quot; rather than &quot;what was true on day one.&quot;</li></ul>\n<h3>Clarifying Questions and Assumptions</h3>\n<p>Asking too many clarifying questions increases friction. The right behavior depends on risk.</p>\n<p>Ask a clarifying question when:</p>\n<ul><li>Multiple interpretations lead to substantially different actions.</li><li>The action is irreversible or costly.</li><li>The user has expressed conflicting goals.</li><li>Required information is truly missing.</li></ul>\n<p>Proceed with stated assumptions when:</p>\n<ul><li>The action is low risk.</li><li>Context strongly suggests the likely intent.</li><li>The user can easily correct the direction.</li></ul>\n<p>Good pattern:</p>\n<pre><code>I&#x27;ll assume you want the report edited for clarity rather than rebuilt from scratch. I&#x27;ll focus on structure and wording first, and you can redirect me if you meant formatting or data analysis.</code></pre>\n<p>For genuinely ambiguous requests, prefer <strong>one focused clarifying question</strong> over a list of three or four. Multiple simultaneous questions feel like an interrogation and frequently cause users to answer only the first. Pick the disambiguation that most changes your next action.</p>\n<p>Front-loading many clarifying questions before any action is also typically wrong. The cost of a small redirected effort is usually lower than the friction of long preflight Q&amp;A. The exception is when the action is irreversible, costly, or touches a regulated domain — there, ask first and proceed only after explicit confirmation.</p>\n<p>When user preferences conflict, do not average them into a vague compromise. Name the tension and ask which priority should govern. For example, if a user wants both &quot;the cheapest possible flight&quot; and &quot;arriving by 9 AM Friday with no layovers,&quot; surface the contradiction explicitly: a cheap nonstop arriving by Friday morning may not exist on this route, so which constraint should bend? Hidden compromises produce results that satisfy neither stated goal and usually require rework.</p>\n<h3>Response Format Control</h3>\n<p>If responses become repetitive, do not only add &quot;never say X&quot; lists. Better options include:</p>\n<ul><li>Better examples in the system prompt.</li><li>A concise style guide.</li><li>A direct instruction to skip preambles and respond immediately with substance.</li><li>Post-processing for purely cosmetic cleanup when safe.</li></ul>\n<p>Repetitive openers (&quot;Great question!&quot;, &quot;I&#x27;d be happy to help&quot;) respond well to an explicit style instruction paired with one or two examples of the desired opening. On older models this was a common use for partial assistant prefill; current models reject trailing assistant prefills, so the system-prompt instruction plus examples is the durable pattern.</p>\n<p>For strict machine-readable output, prefer structured outputs or tool use over text formatting instructions.</p>\n<h3>Common Pitfalls</h3>\n<ul><li><strong>Using &quot;IMPORTANT&quot; and &quot;NEVER&quot; as reliability mechanisms.</strong> They help salience but do not guarantee behavior.</li><li><strong>Adding endless conditionals.</strong> This bloats the prompt and can reduce adherence.</li><li><strong>Hiding key rules in long prose.</strong> Use sections and examples.</li><li><strong>Putting workflow-specific checklists in global memory.</strong> Use slash commands or task-specific prompts when the checklist applies only sometimes.</li></ul>", "search": "6. System Prompt Engineering and Conversational Behavior ### What to Know\n\nThe system prompt defines role, tone, constraints, and priorities. It should be included in every request. It is not a one-time initialization message.\n\nA common confusion is \"the system prompt is sent only on the first turn and Claude remembers it.\" That model is wrong. Claude has no memory between API calls. The system prompt and the full message history must be sent on every request. If your application omits the system prompt on later turns, behavior will diverge from the configured persona immediately, not gradually. Likewise, prior assistant and user messages must be sent in the `messages` array, even when their content seems redundant — the model has no other way to see them.\n\nA separate effect is real, however: even when the system prompt is included on every call, **attention to it weakens as the conversation grows.** This is not because the prompt is \"dropped.\" It is because the model's recent assistant outputs and the latest user turns increasingly compete for attention with the system prompt. After many turns, behavior can drift even though the system prompt is unchanged and the context window is not full. The fix is structural — reinforce key instructions at natural breakpoints, version the prompt for long-lived sessions, and move hard requirements into code or tool implementations.\n\nGood system prompts use clear sections:\n\n```xml\n<role>\nYou are a careful financial education assistant.\n</role>\n\n<style>\nUse plain language for beginners. Match the user's demonstrated sophistication.\n</style>\n\n<safety>\nIf the user asks for personalized investment, legal, or medical decisions, explain limits and recommend a qualified professional where appropriate.\n</safety>\n\n<examples>\n...\n</examples>\n```\n\nXML-style tags are not magic, but they improve salience and organization. They are particularly helpful when the same word means different things in different contexts (a `<role>` block clearly separates persona from a `<style>` block, even if both refe"}, {"id": "ch-8", "title": "Chapter 7 — MCP", "crumb": "Full chapters", "kind": "page", "html": "<div class=\"kicker\">Unabridged chapter</div><h2>7. Model Context Protocol (MCP)</h2><h3>What to Know</h3>\n<p>MCP is an open standard for connecting AI applications to external systems. An MCP server exposes capabilities; MCP clients connect to servers; the host application decides how users and models interact with those capabilities.</p>\n<p>MCP provides three important server-side building blocks:</p>\n<table><tr><th>MCP Feature</th><th>Who Controls It</th><th>Purpose</th></tr><tr><td>Tools</td><td>Model-controlled</td><td>Actions and computations the model may invoke</td></tr><tr><td>Resources</td><td>Application-controlled</td><td>Context such as files, schemas, catalogs, or documents</td></tr><tr><td>Prompts</td><td>User/application-controlled</td><td>Reusable prompt templates or workflows</td></tr></table>\n<p>Use tools for actions: search, update, create, analyze, send, calculate.</p>\n<p>Use resources for passive context: database schemas, documentation trees, issue summaries, file catalogs, API references. Resources reduce exploratory tool calls because the agent can see what information exists before acting.</p>\n<p>Use prompts for reusable workflows: review checklists, report templates, investigation playbooks.</p>\n<p>A common design question is &quot;should this be a resource, a tool, or a separate aggregator?&quot; The default decision rule:</p>\n<ul><li>If the content is reference material the agent might want to consult before acting (database schemas, API specs, file catalogs, project guidelines, configuration), expose it as a <strong>resource</strong>. The agent reads it like context; no tool call is needed beyond the resource fetch.</li><li>If the content is dynamic and requires computation or external lookup at the moment of use (the current state of an order, the result of a query against live data), expose it as a <strong>tool</strong>.</li><li>If the agent is overwhelmed by similar tools across many servers, the right fix is improving descriptions and using progressive availability — not consolidating everything behind a single &quot;natural language entry tool&quot; that re-routes to the underlying tools. That kind of aggregator hides the real tool surface from the model and tends to produce worse selection, not better.</li></ul>\n<p>Resources and tools are complements, not alternatives. A well-designed MCP server typically exposes both: resources for &quot;what is true and stable about this system&quot; and tools for &quot;what actions can be taken on it.&quot; Replacing resources with tools forces the agent to make a tool call to learn anything; replacing tools with resources prevents the agent from acting at all.</p>\n<h3>Why MCP</h3>\n<p>MCP is most valuable when the integration should be reusable across multiple clients or applications. If five AI tools need the same internal ticketing data, expose it once through an MCP server. If only one agent needs a deeply application-specific workflow, a custom tool inside that application may be simpler.</p>\n<p>MCP does not automatically solve authentication, rate limiting, retries, caching, authorization, or performance optimization. Those remain system design responsibili
